spring:
  application:
    name: rack
  web:
    resources:
      cache:
        cachecontrol:
          # Without this the pages go out with Last-Modified and no Cache-Control,
          # so a browser applies heuristic freshness (~10% of the file's age) and
          # can serve a pre-deploy page for hours without asking. no-cache still
          # caches — it just forces revalidation, which answers 304 when unchanged.
          no-cache: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      # No schema migrations: a field can arrive and be absent from old files,
      # and it can leave and still be present in them. Slots written while the
      # slot kept its own photo list still carry a "photos" key; items own their
      # photographs now, so it is read past. Spring Boot defaults to this — said
      # out loud because a load that fails here is every drawer, not one field.
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 20MB
      # A slot is filed as a batch of photos in one request, so the request cap
      # has to be a multiple of the per-file cap rather than equal to it.
      max-request-size: 100MB
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          # Fallback only. Every call names its own model under rack.ai below,
          # because the right answer differs per call and a single shared model
          # silently makes the cheapest one the ceiling for the most important.
          model: claude-sonnet-4-6
          max-tokens: 4096

rack:
  data-dir: ${RACK_DATA_DIR:./data}
  public-base-url: ${RACK_PUBLIC_BASE_URL:}
  ai:
    # Cheapest per job, not cheapest overall — the three calls are not alike.
    #
    # Reading the photos is the one that has to be good. Asked to extract this
    # rack's own tool drawer, claude-haiku-4-5 read the desoldering braid's part
    # number as "D21/1129" where it is "1.26/14329", and reported that at 0.95
    # confidence; it also found four items where there are five and invented a
    # soldering iron. A part number is meant to be null when it isn't legible,
    # and a confidently wrong one is the drift the whole design is against.
    extraction-model: ${RACK_EXTRACTION_MODEL:claude-sonnet-4-6}
    extraction-max-tokens: 4096

    # Answers are shown and stored under "Ask AI" rather than folded into the
    # index, so a weaker answer is visibly a weaker answer. Haiku handles these
    # adequately — it is the accuracy that argues for sonnet, not the cost, at a
    # few tenths of a cent for a question you ask by hand.
    ask-model: ${RACK_ASK_MODEL:claude-sonnet-4-6}
    ask-max-tokens: 2048

    # Bridging "isolating tape" to "electrical tape" is a synonym lookup against
    # a list of words we hand it, not a reasoning job, and it sits in front of a
    # search box. Haiku does it well and does it fast.
    expansion-model: ${RACK_EXPANSION_MODEL:claude-haiku-4-5}
    expansion-max-tokens: 300

    # Dollars per million tokens, for the running total at the foot of each page.
    # Published prices as of 2026-08-05 — a figure on screen that quietly went
    # stale is worse than none, so check these when you change a model. A model
    # with no entry here is counted in tokens and marked as unpriced rather than
    # silently costing nothing. Ids match by prefix, so a dated id the API
    # reports back (claude-haiku-4-5-20251001) is priced by its base entry.
    prices:
      "claude-haiku-4-5": { input: 1.00, output: 5.00 }
      "claude-sonnet-4-6": { input: 3.00, output: 15.00 }
      "claude-sonnet-5": { input: 3.00, output: 15.00 }
      "claude-opus-4-6": { input: 5.00, output: 25.00 }
      "claude-opus-4-7": { input: 5.00, output: 25.00 }
      "claude-opus-4-8": { input: 5.00, output: 25.00 }
      "claude-opus-5": { input: 5.00, output: 25.00 }
      "claude-fable-5": { input: 10.00, output: 50.00 }

server:
  port: 8080
  forward-headers-strategy: FRAMEWORK
  error:
    # Refusals carry the reason the user needs to act on ("still holds items in 3 slots: ...").
    include-message: always
