spring:
  application:
    name: rack
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 4096

rack:
  data-dir: ${RACK_DATA_DIR:./data}
  containers:
    - id: rack
      name: "Parts rack"
      layout:
        kind: grid
        cols: 5
        rows: 12
      label-scale: 1.0

server:
  port: 8080
