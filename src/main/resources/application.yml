spring:
  application:
    name: rack
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-6
          max-tokens: 4096

rack:
  data-dir: ${RACK_DATA_DIR:./data}
  public-base-url: ${RACK_PUBLIC_BASE_URL:}

server:
  port: 8080
  forward-headers-strategy: FRAMEWORK
  error:
    # Refusals carry the reason the user needs to act on ("still holds items in 3 slots: ...").
    include-message: always
