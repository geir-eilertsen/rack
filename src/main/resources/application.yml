spring:
  application:
    name: rack
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-6

rack:
  data-dir: ${RACK_DATA_DIR:./data}

server:
  port: 8080
