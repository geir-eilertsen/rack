spring:
  application:
    name: rack
  jackson:
    property-naming-strategy: SNAKE_CASE
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
    model:
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none

rack:
  data-dir: ${RACK_DATA_DIR:./data}

server:
  port: 8080
