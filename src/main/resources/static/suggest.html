<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — where should this go?</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 640px; color: #222; }
    .back { color: #666; text-decoration: none; font-size: .85rem; }
    .back:hover { color: #222; }
    h1 { font-size: 1.2rem; margin: .25rem 0 1rem; }
    h2 { font-size: .85rem; color: #666; margin: 1.2rem 0 .5rem; text-transform: uppercase; letter-spacing: .05em; }
    .capture { display: block; width: 100%; padding: 1.4rem; font-size: 1rem; border: 2px dashed #666; border-radius: 8px; text-align: center; background: #f8f8f8; cursor: pointer; box-sizing: border-box; }
    .capture input { display: none; }
    #preview img { max-width: 100%; border-radius: 8px; display: block; margin-top: 1rem; }
    .status { margin-top: 1rem; color: #666; font-size: .9rem; }
    .status.error { color: #b00020; }
    .status.ok { color: #0a7f00; }
    .items { list-style: none; padding: 0; margin: 0; }
    .item { padding: .55rem .75rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: .35rem; font-size: .9rem; }
    .item .pn { font-family: ui-monospace, SFMono-Regular, monospace; color: #444; }
    .suggestions { list-style: none; padding: 0; margin: 0; }
    .sug { padding: .75rem; border: 1px solid #ddd; border-radius: 8px; margin-bottom: .5rem; background: #fafafa; }
    .sug.top { border-color: #0a7f00; background: #eefbea; }
    .sug .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .3rem; }
    .sug .head a { color: #333; font-weight: 700; text-decoration: none; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 1rem; }
    .sug .score { font-size: .75rem; color: #666; }
    .sug .verified { font-size: .75rem; color: #666; }
    .sug .verified.stale { color: #b58900; }
    .sug .why { font-size: .8rem; color: #555; margin-bottom: .35rem; }
    .sug .cta { display: inline-block; margin-top: .3rem; padding: .4rem .8rem; background: #333; color: #fff; text-decoration: none; border-radius: 4px; font-size: .85rem; }
    .sug .cta:hover { background: #000; }
    .none { padding: 1rem; border: 1px dashed #ccc; border-radius: 8px; text-align: center; color: #666; }
    .none a { color: #333; }
    .tag { display: inline-block; background: #eef; padding: .05rem .4rem; border-radius: 999px; margin: .05rem .1rem 0 0; font-size: .7rem; }
  </style>
</head>
<body>
  <a class="back" href="/">&larr; rack</a>
  <h1>where should this go?</h1>

  <label class="capture">
    Take a photo
    <input type="file" accept="image/*" capture="environment" id="photo">
  </label>

  <div id="preview"></div>
  <div class="status" id="status"></div>

  <h2 id="itemsHeading" hidden>what I see</h2>
  <ul class="items" id="items"></ul>

  <h2 id="sugHeading" hidden>suggested slots</h2>
  <ul class="suggestions" id="suggestions"></ul>

  <script>
    const photo = document.getElementById('photo');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const items = document.getElementById('items');
    const suggestions = document.getElementById('suggestions');
    const itemsHeading = document.getElementById('itemsHeading');
    const sugHeading = document.getElementById('sugHeading');

    photo.addEventListener('change', async () => {
      const file = photo.files[0];
      if (!file) return;

      preview.innerHTML = '<img src="' + URL.createObjectURL(file) + '">';
      items.innerHTML = '';
      suggestions.innerHTML = '';
      itemsHeading.hidden = true;
      sugHeading.hidden = true;
      status.className = 'status';
      status.textContent = 'Identifying and searching...';

      const form = new FormData();
      form.append('photo', await resize(file));
      try {
        const res = await fetch('/suggest', { method: 'POST', body: form });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const data = await res.json();
        render(data);
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Failed: ' + e.message;
      }
    });

    function render(data) {
      const extracted = data.extracted || [];
      const sugs = data.suggestions || [];
      status.className = 'status ok';
      status.textContent = extracted.length + ' item(s) recognised.';

      if (extracted.length) {
        itemsHeading.hidden = false;
        items.innerHTML = extracted.map(renderItem).join('');
      }

      sugHeading.hidden = false;
      if (sugs.length) {
        suggestions.innerHTML =
          sugs.map((s, i) => renderSuggestion(s, i === 0)).join('') +
          '<li class="none">None of these? <a href="/put.html">Pick another slot</a>.</li>';
      } else {
        suggestions.innerHTML =
          '<li class="none">Nothing similar filed yet. ' +
          '<a href="/put.html">Pick a new slot</a> and file it there.</li>';
      }
    }

    function renderItem(it) {
      const tags = (it.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
      return '<li class="item">' +
        '<strong>' + esc(it.description || '(unknown)') + '</strong>' +
        (it.part_number ? ' &middot; <span class="pn">' + esc(it.part_number) + '</span>' : '') +
        (tags ? '<div>' + tags + '</div>' : '') +
      '</li>';
    }

    function renderSuggestion(s, top) {
      const loc = s.container + ' &middot; ' + s.slot;
      const putUrl = '/put.html?c=' + encodeURIComponent(s.container) + '&s=' + encodeURIComponent(s.slot);
      const matches = (s.matches || []).slice(0, 3)
        .map(m => esc(m.description || '?') + (m.part_number ? ' (' + esc(m.part_number) + ')' : ''))
        .join('; ');
      return '<li class="sug' + (top ? ' top' : '') + '">' +
        '<div class="head">' +
          '<a href="' + putUrl + '">' + loc + '</a>' +
          verifiedBadge(s.last_verified) +
        '</div>' +
        (matches ? '<div class="why">already has: ' + matches + '</div>' : '') +
        '<div class="score">score ' + s.score.toFixed(1) + '</div>' +
        '<a class="cta" href="' + putUrl + '">Add here</a>' +
      '</li>';
    }

    function verifiedBadge(iso) {
      if (!iso) return '<span class="verified">never verified</span>';
      const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
      const label = days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
      return '<span class="verified' + (days > 180 ? ' stale' : '') + '">verified ' + label + '</span>';
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function resize(file, maxDim = 1600, quality = 0.85) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
      if (scale >= 1 && file.size < 3_000_000) return file;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return new Promise(resolve => canvas.toBlob(b => resolve(new File([b], 'photo.jpg', { type: 'image/jpeg' })), 'image/jpeg', quality));
    }
  </script>
</body>
</html>
