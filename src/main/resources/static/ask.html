<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — ask about a project</title>
  <link rel="icon" type="image/svg+xml" href="/assets/rack.svg">
  <link rel="apple-touch-icon" href="/assets/rack.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d97747">
  <link rel="stylesheet" href="/assets/rack.css">
  <link rel="stylesheet" href="/assets/advice.css">
  <style>
    .askbox { display: flex; flex-direction: column; gap: .6rem; margin-bottom: 1rem; }
    .askbox textarea { font-family: inherit; font-size: 1.05rem; padding: .8rem 1rem; min-height: 5.5rem;
      resize: vertical; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
      background: var(--card); color: inherit; }
    .askbox .row { display: flex; gap: .5rem; align-items: center; }
    .askbox .row .btn { flex: 0 0 auto; }
    /* Openers, because the hard part of this is knowing it can be asked at all. */
    .examples { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 1.25rem; }
    .examples button { padding: .35rem .7rem; border: 1px solid var(--border); border-radius: 999px;
      background: var(--card); color: var(--primary-hover); font-size: .82rem; font-family: inherit;
      cursor: pointer; text-align: left; -webkit-tap-highlight-color: transparent; }
    .examples button:hover { background: var(--primary-soft); border-color: var(--primary); }

  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <a class="back" href="/">← Home</a>
      <a class="brand" href="/">
        <img class="logo" src="/assets/rack.svg" alt="">
        <span class="name">rack</span>
      </a>
    </header>

    <h1>Ask about a project</h1>
    <p class="callout">Say what you're building or fixing. Every item in every container is read
      — nothing is sampled — and you get back what you have, which drawer it's in, and what's missing.</p>

    <div class="askbox">
      <textarea id="q" placeholder="I am restoring a Quad 606 amplifier. Do I have all the parts?"
        aria-label="Your question"></textarea>
      <div class="row">
        <button class="btn primary" id="go">Ask</button>
        <span class="status" id="status"></span>
      </div>
    </div>

    <div class="examples" id="examples"></div>

    <div id="out"></div>
    <div id="planOut"></div>
  </div>

  <script src="/assets/route.js"></script>
  <script src="/assets/usage.js"></script>
  <script src="/assets/advice.js"></script>
  <script>
    const esc = rackAdvice.esc;
    const q = document.getElementById('q');
    const go = document.getElementById('go');
    const status = document.getElementById('status');
    const out = document.getElementById('out');
    const planOut = document.getElementById('planOut');

    // The answer and the plan as they were rendered. A project is built from what
    // is on screen rather than by asking again: both have been paid for and read,
    // and a plan you have read is the one worth keeping.
    let lastAnswer = null;
    let lastPlan = null;

    const EXAMPLES = [
      'I am restoring a Quad 606 amplifier. Do I have all the parts?',
      'What do I need to build a bench power supply?',
      'Can I repair a pair of headphones with a broken cable?',
      'What am I missing to solder surface-mount parts?'
    ];

    const examples = document.getElementById('examples');
    examples.innerHTML = EXAMPLES.map((e, i) =>
      '<button type="button" data-i="' + i + '">' + esc(e) + '</button>').join('');
    examples.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      q.value = EXAMPLES[Number(b.dataset.i)];
      ask();
    }));

    go.addEventListener('click', ask);
    // Enter sends, newline needs a modifier — the box is multi-line because a
    // project takes a sentence or two to describe, not because it wants prose.
    q.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
    });

    async function ask() {
      const question = q.value.trim();
      if (!question) { q.focus(); return; }
      go.disabled = true;
      // Say what it is doing and why it takes a moment: one call over everything,
      // which is the thing that makes the answer worth trusting.
      setStatus('', 'Reading every item…');
      out.innerHTML = '';
      planOut.innerHTML = '';
      lastAnswer = null;
      lastPlan = null;
      try {
        lastAnswer = await rackAdvice.ask(question);
        out.innerHTML = rackAdvice.renderAnswer(lastAnswer);
        addActions();
        setStatus('', '');
        if (window.rackUsage) rackUsage.refresh();
      } catch (e) {
        setStatus('error', 'Could not answer that: ' + e.message);
      } finally {
        go.disabled = false;
      }
    }

    function addActions() {
      const toBuy = rackAdvice.gaps(lastAnswer);
      out.insertAdjacentHTML('beforeend',
        '<div class="plan-bar">'
        + (toBuy.length
            ? '<button class="btn primary" id="planBtn">Plan the order for '
              + toBuy.length + (toBuy.length === 1 ? ' part' : ' parts') + '</button>'
            : '')
        // Worth keeping even when nothing is missing: the steps and the ticking
        // off are most of what a project is for.
        + '<button class="btn" id="keepBtn">Keep this as a project</button>'
        + '<span class="status" id="planStatus"></span></div>');
      if (toBuy.length) document.getElementById('planBtn').addEventListener('click', plan);
      document.getElementById('keepBtn').addEventListener('click', keep);
    }

    async function plan() {
      const btn = document.getElementById('planBtn');
      const st = document.getElementById('planStatus');
      btn.disabled = true;
      st.className = 'status';
      st.textContent = 'Grouping by supplier and writing up the job…';
      planOut.innerHTML = '';
      try {
        lastPlan = await rackAdvice.plan(lastAnswer.question,
          rackAdvice.gaps(lastAnswer).map(rackAdvice.shoppingLine));
        planOut.innerHTML = rackAdvice.renderPlan(lastPlan)
          + '<div class="plan-bar"><button class="btn primary" id="keepBtn2">'
          + 'Start this project — keep the list and tick it off</button>'
          + '<span class="status" id="keepStatus"></span></div>';
        document.getElementById('keepBtn2').addEventListener('click', keep);
        st.textContent = '';
        if (window.rackUsage) rackUsage.refresh();
        planOut.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (e) {
        st.className = 'status error';
        st.textContent = 'Could not plan that: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function keep() {
      if (!lastAnswer) return;
      const st = document.getElementById('keepStatus') || document.getElementById('planStatus');
      const btns = [document.getElementById('keepBtn'), document.getElementById('keepBtn2')].filter(Boolean);
      btns.forEach(b => b.disabled = true);
      if (st) { st.className = 'status'; st.textContent = 'Keeping it…'; }
      try {
        const res = await fetch('/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            brief: lastAnswer.question,
            parts: rackAdvice.partsFrom(lastAnswer, lastPlan),
            steps: rackAdvice.stepsFrom(lastPlan),
            cautions: (lastPlan && lastPlan.cautions) || []
          })
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const project = await res.json();
        location.href = rackRoute.projectHref(project.id);
      } catch (e) {
        btns.forEach(b => b.disabled = false);
        if (st) { st.className = 'status error'; st.textContent = 'Could not keep it: ' + e.message; }
      }
    }

    function setStatus(kind, text) {
      status.className = 'status' + (kind ? ' ' + kind : '');
      status.textContent = text;
    }
  </script>
</body>
</html>
