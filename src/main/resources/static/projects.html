<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — projects</title>
  <link rel="icon" type="image/svg+xml" href="/assets/rack.svg">
  <link rel="apple-touch-icon" href="/assets/rack.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d97747">
  <link rel="stylesheet" href="/assets/rack.css">
  <link rel="stylesheet" href="/assets/project.css">
  <style>
    .plist { list-style: none; padding: 0; margin: 0; }
    .plist > li { margin-bottom: .75rem; }
    .pcard { display: block; padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); box-shadow: var(--shadow); text-decoration: none; color: inherit; }
    .pcard:hover { border-color: var(--primary); }
    .pcard .top { display: flex; gap: .6rem; align-items: baseline; }
    .pcard .nm { font-weight: 700; flex: 1; min-width: 0; }
    .pcard .meta { margin: .4rem 0 0; font-size: .85rem; color: var(--muted); }
    .pcard .next { margin: .5rem 0 0; font-size: .9rem; }
    .pcard .next b { color: var(--primary-hover); }
    .newbox { display: flex; gap: .5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .newbox input { flex: 1; min-width: 12rem; font-size: 1rem; padding: .7rem .9rem; }
    .alt { margin: .6rem 0 1.5rem; font-size: .9rem; color: var(--muted); }
    .alt a { color: var(--primary-hover); font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <a class="back" href="/">← Home</a>
      <a class="brand" href="/">
        <img class="logo" src="/assets/rack.svg" alt="">
        <span class="name">rack</span>
      </a>
    </header>

    <h1>Projects</h1>
    <p class="callout">A job of work, from finding out what it needs to putting the lid back on.
      Name one and its page will work out the parts and the steps for you.</p>

    <div class="newbox">
      <input id="newName" placeholder="Name a project — e.g. Quad 606 recap" aria-label="New project name">
      <button class="btn primary" id="newBtn">Start it</button>
    </div>
    <!-- The other way in, for when the job is easier to describe than to name.
         Not on the front page any more: it is help with a project, so it lives
         beside them rather than beside finding a part. -->
    <p class="alt"><a href="/ask.html">Or start from a question</a> — describe the job and
      keep the answer as a project.</p>
    <div class="status" id="status"></div>

    <ul class="plist" id="list"></ul>
  </div>

  <script src="/assets/usage.js"></script>
  <script src="/assets/project.js"></script>
  <script>
    const list = document.getElementById('list');
    const status = document.getElementById('status');

    load();

    async function load() {
      try {
        const res = await fetch('/projects');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        render(await res.json());
      } catch (e) {
        list.innerHTML = '<li class="empty">Could not load projects: ' + rackProject.esc(e.message) + '</li>';
      }
    }

    function render(items) {
      if (!items.length) {
        list.innerHTML = '<li class="empty">No projects yet.</li>';
        return;
      }
      list.innerHTML = items.map(p =>
        '<li><a class="pcard" href="/project.html?p=' + encodeURIComponent(p.id) + '">'
        + '<div class="top"><span class="nm">' + rackProject.esc(p.name) + '</span>'
        + rackProject.statusTag(p.status) + '</div>'
        + '<p class="meta">' + rackProject.summary(p) + '</p>'
        + (p.next ? '<p class="next">Next: <b>' + rackProject.esc(p.next) + '</b></p>' : '')
        + '</a></li>').join('');
    }

    document.getElementById('newBtn').addEventListener('click', create);
    document.getElementById('newName').addEventListener('keydown', e => {
      if (e.key === 'Enter') create();
    });

    async function create() {
      const name = document.getElementById('newName').value.trim();
      if (!name) return;
      status.className = 'status';
      status.textContent = 'Starting…';
      try {
        const res = await fetch('/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, parts: [], steps: [], cautions: [] })
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const p = await res.json();
        location.href = '/project.html?p=' + encodeURIComponent(p.id);
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Could not start it: ' + e.message;
      }
    }
  </script>
</body>
</html>
