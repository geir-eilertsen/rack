<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — register a container</title>
  <link rel="icon" type="image/svg+xml" href="/assets/rack.svg">
  <link rel="apple-touch-icon" href="/assets/rack.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d97747">
  <link rel="stylesheet" href="/assets/rack.css">
  <style>
    .form-card { padding: 1.25rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
    fieldset { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .5rem 1rem 1rem; margin: .75rem 0 0; background: var(--bg); }
    legend { font-size: .75rem; color: var(--muted); padding: 0 .35rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
    .actions { margin-top: 1.25rem; }
    .post-actions { margin-top: 1rem; display: flex; gap: .5rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <a class="back" href="/">← Home</a>
      <a class="brand" href="/">
        <img class="logo" src="/assets/rack.svg" alt="">
        <span class="name">rack</span>
      </a>
    </header>

    <h1>Register a container</h1>
    <p class="subtitle">Add a rack, bin, or shelf. Pick a shape and get labels sized for it.</p>

    <div class="form-card">
      <label class="field" for="name">Name</label>
      <input id="name" type="text" placeholder="e.g. Small parts bin">

      <label class="field" for="id">ID (URL-safe)</label>
      <input id="id" type="text" placeholder="e.g. small-bin" pattern="[a-z][a-z0-9\-]{0,31}">
      <p class="hint">Lowercase letters, digits, hyphens. Auto-derived from the name.</p>

      <label class="field" for="kind">Layout</label>
      <select id="kind">
        <option value="grid">Grid (columns × rows, labelled A1, B1, C1, ...)</option>
        <option value="linear">Linear (numbered 1 to N, optional prefix)</option>
      </select>

      <fieldset id="gridFields">
        <legend>Grid</legend>
        <div class="grid-2">
          <div>
            <label class="field" for="cols">Columns</label>
            <input id="cols" type="number" min="1" max="26" value="5">
          </div>
          <div>
            <label class="field" for="rows">Rows</label>
            <input id="rows" type="number" min="1" max="30" value="12">
          </div>
        </div>
      </fieldset>

      <fieldset id="linearFields" hidden>
        <legend>Linear</legend>
        <div class="grid-2">
          <div>
            <label class="field" for="count">Count</label>
            <input id="count" type="number" min="1" max="200" value="24">
          </div>
          <div>
            <label class="field" for="prefix">Prefix (optional)</label>
            <input id="prefix" type="text" placeholder="e.g. b for b1, b2, ...">
          </div>
        </div>
      </fieldset>

      <label class="field" for="scale">Label scale</label>
      <input id="scale" type="number" min="0.1" max="1.5" step="0.05" value="1.0">
      <p class="hint">1.0 fills the full L7160 label. Try 0.4 for small drawers — content shrinks so you can trim smaller.</p>

      <div class="actions">
        <button class="btn primary block" id="submit">Register container</button>
      </div>
      <div class="status" id="status"></div>
      <div class="post-actions" id="postActions" hidden></div>
    </div>
  </div>

  <script>
    const nameEl = document.getElementById('name');
    const idEl = document.getElementById('id');
    const kindEl = document.getElementById('kind');
    const gridFields = document.getElementById('gridFields');
    const linearFields = document.getElementById('linearFields');
    const colsEl = document.getElementById('cols');
    const rowsEl = document.getElementById('rows');
    const countEl = document.getElementById('count');
    const prefixEl = document.getElementById('prefix');
    const scaleEl = document.getElementById('scale');
    const submit = document.getElementById('submit');
    const status = document.getElementById('status');
    const postActions = document.getElementById('postActions');

    let idEdited = false;
    idEl.addEventListener('input', () => idEdited = true);
    nameEl.addEventListener('input', () => { if (!idEdited) idEl.value = deriveId(nameEl.value); });
    kindEl.addEventListener('change', () => {
      gridFields.hidden = kindEl.value !== 'grid';
      linearFields.hidden = kindEl.value !== 'linear';
    });
    submit.addEventListener('click', register);

    async function register() {
      const body = {
        id: idEl.value.trim(),
        name: nameEl.value.trim(),
        layout: {
          kind: kindEl.value,
          cols: kindEl.value === 'grid' ? parseInt(colsEl.value, 10) : null,
          rows: kindEl.value === 'grid' ? parseInt(rowsEl.value, 10) : null,
          count: kindEl.value === 'linear' ? parseInt(countEl.value, 10) : null,
          prefix: kindEl.value === 'linear' ? (prefixEl.value.trim() || null) : null
        },
        label_scale: parseFloat(scaleEl.value)
      };
      status.className = 'status';
      status.textContent = 'Registering...';
      postActions.hidden = true;
      submit.disabled = true;
      try {
        const res = await fetch('/c', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const c = await res.json();
        status.className = 'status ok';
        status.textContent = '"' + c.name + '" registered — ' + c.slots.length + ' slots.';
        postActions.innerHTML =
          '<a class="btn" href="/labels.html">Print labels</a>' +
          '<a class="btn" href="/put.html?c=' + encodeURIComponent(c.id) + '">Add an item</a>';
        postActions.hidden = false;
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Failed: ' + e.message;
      } finally {
        submit.disabled = false;
      }
    }

    function deriveId(s) {
      return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').replace(/^[^a-z]/, '').slice(0, 32);
    }
  </script>
</body>
</html>
