<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — project</title>
  <link rel="icon" type="image/svg+xml" href="/assets/rack.svg">
  <link rel="apple-touch-icon" href="/assets/rack.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d97747">
  <link rel="stylesheet" href="/assets/rack.css">
  <link rel="stylesheet" href="/assets/project.css">
  <style>
    .head { display: flex; gap: .6rem; align-items: baseline; flex-wrap: wrap; margin-bottom: .3rem; }
    .head h1 { margin: 0; flex: 1; min-width: 0; }
    .brief { color: var(--muted); font-size: .92rem; margin: 0 0 1rem; }
    .bar { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.25rem; align-items: center; }
    .bar select { font-family: inherit; font-size: .9rem; padding: .45rem .6rem;
      border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--card); color: inherit; }
    .section-head { font-size: 1.1rem; font-weight: 700; margin: 1.75rem 0 .6rem;
      display: flex; align-items: baseline; gap: .5rem; }
    .section-head .of { font-size: .85rem; font-weight: 400; color: var(--muted); }

    /* What is next, said once and loudly — it is the question a stored project answers. */
    .upnext { padding: 1rem; border: 1px solid var(--primary); border-left-width: 3px;
      border-radius: var(--radius); background: var(--primary-soft); margin-bottom: 1rem; }
    .upnext .lbl { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
      font-weight: 700; color: var(--primary-hover); }
    .upnext .t { font-weight: 700; margin: .25rem 0 0; }
    .upnext .d { margin: .35rem 0 0; font-size: .92rem; }

    .cautions { padding: .9rem 1rem; border: 1px solid var(--error); border-left-width: 3px;
      border-radius: var(--radius); background: var(--error-soft); margin-bottom: 1rem; }
    .cautions h3 { margin: 0 0 .4rem; font-size: .95rem; color: var(--error); }
    .cautions ul { margin: 0; padding-left: 1.2rem; font-size: .9rem; }

    .rows { list-style: none; padding: 0; margin: 0; }
    .rows > li { padding: .75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); box-shadow: var(--shadow); margin-bottom: .5rem; }
    .rows .r { display: flex; gap: .65rem; align-items: flex-start; }
    .rows .body { flex: 1; min-width: 0; }
    .rows .t { font-weight: 600; }
    .rows .d { margin: .25rem 0 0; font-size: .9rem; color: var(--muted); }
    .rows li.ticked .t { text-decoration: line-through; color: var(--muted); }
    .tick { flex: 0 0 auto; width: 1.5rem; height: 1.5rem; margin-top: .1rem; cursor: pointer;
      accent-color: var(--primary); }
    .num { flex: 0 0 auto; font-family: var(--font-mono); font-weight: 700; color: var(--muted);
      min-width: 1.5rem; text-align: right; }
    .uses { list-style: none; padding: 0; margin: .45rem 0 0; font-size: .85rem; }
    .uses li { margin-top: .15rem; }
    .uses a { color: var(--primary-hover); font-family: var(--font-mono); font-weight: 700; text-decoration: none; }
    .uses a:hover { text-decoration: underline; }
    .stepnote { margin: .45rem 0 0; }
    .stepnote textarea { width: 100%; box-sizing: border-box; font-family: inherit; font-size: .88rem;
      padding: .45rem .6rem; border: 1px solid var(--border); border-radius: var(--radius-xs);
      background: var(--bg); color: inherit; resize: vertical; min-height: 2.2rem; }

    /* One card per supplier, not per part. Nineteen of these came from Farnell,
       so nineteen cards each repeating "Farnell (element14) — Norwegian account"
       was the same fact printed nineteen times and the parts lost among it. */
    .group { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
      box-shadow: var(--shadow); margin-bottom: .75rem; overflow: hidden; }
    /* Baseline alignment, not centre: a <select> has no useful baseline, and
       aligning one against text puts it a couple of pixels low in every browser
       and differently in each. flex-wrap so a long supplier name pushes the count
       and the button onto their own line instead of squashing them. */
    .group > .gh { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
      padding: .65rem .9rem; border-bottom: 1px solid var(--border); background: var(--primary-soft); }
    .group > .gh .gn { font-weight: 700; font-size: .95rem; flex: 1 1 12rem; min-width: 0; }
    .group > .gh .gc { font-size: .8rem; color: var(--muted); white-space: nowrap; }
    .group.here > .gh { background: var(--success-soft); }
    .plines { list-style: none; padding: 0; margin: 0; }
    .plines > li { padding: .6rem .9rem; border-top: 1px solid var(--border); }
    .plines > li:first-child { border-top: none; }
    .plines > li.is-used { opacity: .55; }

    /* Text on the left, controls on the right, and nothing aligned by a magic
       number. The sub-line and the caveat used to be pushed across by a 2.45rem
       margin chosen to clear a fixed-width quantity column — which was wrong on
       every row that had no quantity, and there are eight of those. */
    .pl-row { display: flex; gap: .6rem; align-items: flex-start; }
    .pl-body { flex: 1; min-width: 0; }
    .pl-act { flex: 0 0 auto; display: flex; gap: .3rem; align-items: center; }
    .pl-name { font-weight: 600; font-size: .95rem; overflow-wrap: anywhere; }
    /* Inline, so a row with no quantity is not indented past an empty column. */
    .qty { font-family: var(--font-mono); font-weight: 700; color: var(--primary-hover);
      font-variant-numeric: tabular-nums; margin-right: .15rem; }
    .pl-sub { margin: .2rem 0 0; font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
    .pl-sub .code { font-family: var(--font-mono); color: var(--success); }
    .pl-sub .term { font-family: var(--font-mono); }
    .pl-sub a { color: var(--primary-hover); font-family: var(--font-mono); font-weight: 700; text-decoration: none; }
    .pl-sub a:hover { text-decoration: underline; }
    /* A 250-character caveat is worth keeping and not worth reading twenty times. */
    .pl-why { margin: .3rem 0 0; font-size: .82rem; }
    .pl-why summary { cursor: pointer; color: var(--primary-hover); width: fit-content; }
    .pl-why[open] summary { margin-bottom: .2rem; }
    .pl-why p { margin: 0; color: var(--muted); overflow-wrap: anywhere; }
    .pstate { font-family: inherit; font-size: .78rem; padding: .25rem .4rem; max-width: 6.5rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); color: var(--muted); }
    .used { width: 3.4rem; font-family: inherit; font-size: .78rem; padding: .25rem .35rem;
      border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: inherit; }
    .gh .btn { padding: .25rem .55rem; font-size: .78rem; }
    /* Below this the controls will not fit beside a part name worth reading, so
       they go under it, right-aligned, rather than crushing the text to a column. */
    @media (max-width: 30rem) {
      .pl-row { flex-wrap: wrap; }
      .pl-body { flex: 1 1 100%; }
      .pl-act { margin-left: auto; }
    }

    /* Reference material, consulted throughout rather than at one step, so it
       sits above the parts. */
    .docs { list-style: none; padding: 0; margin: 0; }
    .docs > li { display: flex; gap: .6rem; align-items: center; padding: .55rem .9rem;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
      box-shadow: var(--shadow); margin-bottom: .4rem; }
    .docs .dt { flex: 1; min-width: 0; }
    .docs .dt a { color: var(--primary-hover); font-weight: 600; text-decoration: none;
      overflow-wrap: anywhere; }
    .docs .dt a:hover { text-decoration: underline; }
    .docs .dm { display: block; font-size: .78rem; color: var(--muted); margin-top: .1rem; }
    .docs .drop { flex: 0 0 auto; background: transparent; border: none; color: var(--error);
      font-size: 1.1rem; line-height: 1; cursor: pointer; padding: .2rem .35rem; }
    .docadd { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .5rem 0 0; }
    .docadd .pick { display: inline-flex; }
    /* Searches, not links to a document. The app cannot reach the internet and
       neither can the model, so anything claiming to be the manual's address
       would be a guess. */
    .look { margin: .9rem 0 0; padding: .7rem .9rem; border: 1px dashed var(--border-strong);
      border-radius: var(--radius); font-size: .85rem; }
    .look .lh { color: var(--muted); }
    .look .ls { display: inline-flex; flex-wrap: wrap; gap: .35rem; margin-top: .4rem; }
    .look .ls a { padding: .3rem .6rem; border: 1px solid var(--border); border-radius: 999px;
      background: var(--card); color: var(--primary-hover); text-decoration: none; font-size: .82rem; }
    .look .ls a:hover { background: var(--primary-soft); border-color: var(--primary); }

    .log { list-style: none; padding: 0; margin: 0; font-size: .88rem; }
    .log li { padding: .4rem 0; border-top: 1px solid var(--border); display: flex; gap: .6rem; }
    .log li:first-child { border-top: none; }
    /* A fixed column, so "today" and "12 days ago" do not start the text at two
       different places down the same list. */
    .log .at { flex: 0 0 5.5rem; color: var(--muted); font-variant-numeric: tabular-nums;
      font-size: .82rem; }
    .log .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .log li.user .tx { font-weight: 600; }
    .notebox { display: flex; gap: .5rem; margin: .75rem 0 0; }
    .notebox input { flex: 1; min-width: 0; font-size: .95rem; padding: .55rem .75rem; }

    .settle { padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); box-shadow: var(--shadow); }
    .settle table { width: 100%; border-collapse: collapse; font-size: .9rem; margin: .6rem 0; }
    .settle th, .settle td { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid var(--border); }
    .settle th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .settle td.n { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--font-mono); }
    .settle .problems { margin: .5rem 0 0; padding-left: 1.2rem; font-size: .88rem; color: #8a5a12; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <a class="back" href="/projects.html">← Projects</a>
      <a class="brand" href="/">
        <img class="logo" src="/assets/rack.svg" alt="">
        <span class="name">rack</span>
      </a>
    </header>

    <div id="page"></div>
    <div class="status" id="status"></div>
  </div>

  <script src="/assets/usage.js"></script>
  <script src="/assets/project.js"></script>
  <script>
    const esc = rackProject.esc;
    const page = document.getElementById('page');
    const status = document.getElementById('status');
    const id = new URLSearchParams(location.search).get('p');
    let project = null;

    if (!id) page.innerHTML = '<p class="empty">No project named in the address.</p>';
    else load();

    async function load() {
      try {
        const res = await fetch('/projects/' + encodeURIComponent(id));
        if (!res.ok) throw new Error(res.status === 404 ? 'No such project.' : ('HTTP ' + res.status));
        project = await res.json();
        render();
      } catch (e) {
        page.innerHTML = '<p class="empty">' + esc(e.message) + '</p>';
      }
    }

    /** Every change returns the whole project, so the page is redrawn from truth. */
    async function send(path, method, body) {
      setStatus('', 'Saving…');
      try {
        const res = await fetch('/projects/' + encodeURIComponent(id) + path, {
          method,
          headers: body ? { 'Content-Type': 'application/json' } : undefined,
          body: body ? JSON.stringify(body) : undefined
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        project = await res.json();
        render();
        setStatus('ok', 'Saved.');
        return true;
      } catch (e) {
        setStatus('error', 'Could not save: ' + e.message);
        return false;
      }
    }

    function render() {
      const p = project;
      const steps = p.steps || [];
      const parts = p.parts || [];
      const next = steps.find(s => !s.done);
      const doneCount = steps.filter(s => s.done).length;

      page.innerHTML =
        '<div class="head"><h1>' + esc(p.name) + '</h1>' + rackProject.statusTag(p.status) + '</div>'
        + (p.brief && p.brief !== p.name ? '<p class="brief">' + esc(p.brief) + '</p>' : '')
        + '<div class="bar">'
          + '<select id="statusPick" aria-label="Project status">'
            + ['planning', 'shopping', 'building', 'done', 'parked'].map(s =>
                '<option value="' + s + '"' + (s === p.status ? ' selected' : '') + '>' + s + '</option>').join('')
          + '</select>'
          + '<button class="btn" id="renameBtn">Rename</button>'
          + '<button class="btn danger" id="deleteBtn">Delete</button>'
        + '</div>'

        + (next
            ? '<div class="upnext"><div class="lbl">Up next</div><p class="t">' + esc(next.title) + '</p>'
              + (next.detail ? '<p class="d">' + esc(next.detail) + '</p>' : '') + '</div>'
            : (steps.length ? '<div class="upnext"><div class="lbl">Up next</div>'
                + '<p class="t">Every step is ticked.</p>'
                + '<p class="d">Settle up below when the parts you used are recorded, then mark it done.</p></div>' : ''))

        + ((p.cautions || []).length
            ? '<div class="cautions"><h3>Cautions</h3><ul>'
              + p.cautions.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul></div>'
            : '')

        + '<div class="section-head">Documents'
          + ((p.documents || []).length ? ' <span class="of">' + p.documents.length + '</span>' : '') + '</div>'
        + documentsBlock(p)

        + (parts.length
            ? '<div class="section-head">Parts <span class="of">'
              + parts.filter(x => x.status === 'to_buy' || x.status === 'ordered').length + ' still to come</span></div>'
              + partGroups(parts)
            : '')

        + (steps.length
            ? '<div class="section-head">Steps <span class="of">' + doneCount + ' of ' + steps.length + '</span></div>'
              + '<ul class="rows" id="steps">' + steps.map(stepRow).join('') + '</ul>'
            : '')

        + '<div class="section-head">Settle up</div><div class="settle" id="settle">'
          + '<p>Reduce the drawers by what this job used. This is the only thing in rack that '
          + 'records stock <em>leaving</em> — a camera cannot see parts that went into an amplifier.</p>'
          + '<button class="btn" id="settleBtn">Show what it would change</button>'
          + '<div id="settleOut"></div>'
        + '</div>'

        + '<div class="section-head">Log</div>'
        + '<ul class="log">' + (p.log || []).slice().reverse().map(n =>
            '<li class="' + esc(n.by) + '"><span class="at">' + rackProject.when(n.at, '') .trim()
            + '</span><span class="tx">' + esc(n.text) + '</span></li>').join('') + '</ul>'
        + '<div class="notebox"><input id="noteText" placeholder="What happened?" aria-label="Add a note">'
          + '<button class="btn" id="noteBtn">Add</button></div>';

      wire();
    }

    /**
     * Kept files, and honest ways to go looking for the ones not kept yet.
     *
     * <p>Step one of this plan is "download the service manual". Keeping it here
     * is so step one never happens twice — and so the schematic sits beside the
     * drawer links rather than in whichever downloads folder it landed in.
     */
    function documentsBlock(p) {
      const docs = p.documents || [];
      return (docs.length
          ? '<ul class="docs">' + docs.map(docRow).join('') + '</ul>'
          : '<p class="empty">Nothing kept yet — the manual, the schematic, a photo of the board before you stripped it.</p>')
        + '<div class="docadd">'
          + '<label class="btn pick">Add a document'
          + '<input type="file" id="docFile" hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.md,image/*,application/pdf">'
          + '</label>'
          + '<span class="status" id="docStatus"></span>'
        + '</div>'
        + lookBlock(p.name);
    }

    function docRow(d) {
      return '<li><span class="dt">'
        + '<a href="/documents/' + encodeURIComponent(d.filename) + '" target="_blank" rel="noopener">'
        + esc(d.title) + '</a>'
        + '<span class="dm">' + size(d.size) + ' · kept ' + rackProject.when(d.added_at, '').trim() + '</span>'
        + '</span>'
        + '<button class="drop" type="button" title="Remove this document" data-doc="'
        + esc(d.filename) + '">×</button></li>';
    }

    function size(bytes) {
      if (bytes == null) return 'unknown size';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' kB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    /**
     * Searches built from the project's name, not addresses of documents.
     *
     * <p>rack cannot reach the internet, and neither can the model that writes
     * the plans — asked where to buy compound it answered "I can't browse the
     * internet, but here are reliable sources". A list of URLs from something
     * that cannot open one is a list of guesses, and being sent where the manual
     * is not is worse than not being sent. A search box always exists.
     */
    function lookBlock(name) {
      const q = encodeURIComponent((name || '').trim());
      if (!q) return '';
      const LOOKS = [
        ['service manual', 'https://duckduckgo.com/?q=' + q + '+service+manual'],
        ['schematic (PDF)', 'https://duckduckgo.com/?q=' + q + '+schematic+filetype%3Apdf'],
        ['on Google', 'https://www.google.com/search?q=' + q + '+service+manual+pdf']
      ];
      return '<div class="look"><span class="lh">Haven\'t got the manual? These are searches for '
        + '<strong>' + esc(name) + '</strong> — rack can\'t fetch documents, so where to look is a '
        + 'search box, not a link it made up.</span>'
        + '<span class="ls">' + LOOKS.map(([label, url]) =>
            '<a href="' + url + '" target="_blank" rel="noopener">' + esc(label) + '</a>').join('')
        + '</span></div>';
    }

    const HERE = 'Already in the rack';
    const UNSOURCED = 'Still to source';

    /**
     * Which group a part belongs in. Having no supplier is not the same as being
     * on the shelf: the assorted-capacitors line came off the checklist with no
     * supplier and was then marked ordered, and it sat under "Already in the
     * rack" saying "ordered" — a heading contradicting the row beneath it.
     */
    function groupOf(x) {
      if (x.supplier && x.supplier.trim()) return x.supplier.trim();
      return (x.status === 'in_stock' || x.status === 'used') ? HERE : UNSOURCED;
    }

    /**
     * Grouped by supplier, which is what the list is for: eighteen of these come
     * from Farnell, and a card each repeating "Farnell (element14) — Norwegian
     * account" printed one fact eighteen times and lost the parts among it.
     *
     * Groups still owing something come first, because those are the ones with
     * anything to do. Order within a group is left as the plan had it.
     */
    function partGroups(parts) {
      const groups = new Map();
      parts.forEach((x, i) => {
        const key = groupOf(x);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push({ x, i });
      });
      const owing = g => g.some(r => r.x.status === 'to_buy' || r.x.status === 'ordered');
      return [...groups.entries()]
        .sort((a, b) => (owing(b[1]) ? 1 : 0) - (owing(a[1]) ? 1 : 0))
        .map(([name, rows]) => group(name, rows)).join('');
    }

    function group(name, rows) {
      const left = rows.filter(r => r.x.status === 'to_buy' || r.x.status === 'ordered').length;
      const here = name === HERE;
      // Pasteable, because the next thing you do with a shopping list is put it
      // into somebody's search box.
      const plain = rows.filter(r => !here).map(r =>
        (r.x.qty ? r.x.qty + '× ' : '') + r.x.part
        + (r.x.code ? '  [' + r.x.code + ']' : '')
        + (r.x.search ? '  (' + r.x.search + ')' : '')).join('\n');
      return '<div class="group' + (here ? ' here' : '') + '">'
        + '<div class="gh"><span class="gn">' + esc(name) + '</span>'
        + '<span class="gc">' + (here ? rows.length + ' on the shelf' : left + ' of ' + rows.length + ' to get') + '</span>'
        + (here ? '' : '<button class="btn" type="button" data-copy="' + esc(plain) + '">Copy</button>')
        + '</div><ul class="plines">' + rows.map(r => partLine(r.x, r.i)).join('') + '</ul></div>';
    }

    function partLine(x, i) {
      const states = ['in_stock', 'to_buy', 'ordered', 'arrived', 'used'];
      const where = (x.from || []).map(f =>
        '<a href="/put.html?c=' + encodeURIComponent(f.container) + '&s=' + encodeURIComponent(f.slot)
        + '">' + esc(f.container) + ' · ' + esc(f.slot) + '</a>'
        + (f.item ? ' ' + esc(f.item) : '')).join(' &nbsp; ');
      const sub = [
        where,
        x.code ? '<span class="code">' + esc(x.code) + '</span>' : '',
        x.search ? '<span class="term">' + esc(x.search) + '</span>' : ''
      ].filter(Boolean).join(' · ');
      return '<li' + (x.status === 'used' ? ' class="is-used"' : '') + '>'
        + '<div class="pl-row">'
          + '<div class="pl-body">'
            + '<div class="pl-name">'
              + (x.qty ? '<span class="qty">' + esc(x.qty) + '×</span>' : '')
              + esc(x.part) + '</div>'
            + (sub ? '<div class="pl-sub">' + sub + '</div>' : '')
            + (x.note ? '<details class="pl-why"><summary>why / caveats</summary><p>'
                + esc(x.note) + '</p></details>' : '')
          + '</div>'
          + '<div class="pl-act">'
            + '<select class="pstate" data-part="' + i + '" aria-label="Part state">'
              + states.map(s => '<option value="' + s + '"' + (s === x.status ? ' selected' : '') + '>'
                  + s.replace('_', ' ') + '</option>').join('')
            + '</select>'
            // Only asked for once it matters: how many were used is the number
            // that settles up, and it is not knowable before the job is done.
            + (x.status === 'used'
                ? '<input class="used" type="number" min="0" inputmode="numeric" data-used="' + i + '"'
                  + ' value="' + (x.used_qty == null ? '' : x.used_qty) + '" placeholder="qty" aria-label="Quantity used">'
                : '')
          + '</div>'
        + '</div></li>';
    }

    function stepRow(s, i) {
      return '<li class="' + (s.done ? 'ticked' : '') + '">'
        + '<div class="r"><span class="num">' + (i + 1) + '</span>'
        + '<input class="tick" type="checkbox" data-step="' + i + '"' + (s.done ? ' checked' : '')
          + ' aria-label="Step done">'
        + '<div class="body"><div class="t">' + esc(s.title) + '</div>'
        + (s.detail ? '<div class="d">' + esc(s.detail) + '</div>' : '')
        + ((s.uses || []).length
            ? '<ul class="uses">' + s.uses.map(u =>
                '<li>Uses <a href="/put.html?c=' + encodeURIComponent(u.container) + '&s='
                + encodeURIComponent(u.slot) + '">' + esc(u.container) + ' · ' + esc(u.slot) + '</a>'
                + (u.item ? ' — ' + esc(u.item) : '') + '</li>').join('') + '</ul>'
            : '')
        + '<div class="stepnote"><textarea data-note="' + i + '" rows="1" placeholder="Note — what you found, what you changed">'
          + esc(s.note || '') + '</textarea></div>'
        + '</div></div></li>';
    }

    function wire() {
      document.querySelectorAll('.tick').forEach(b => b.addEventListener('change', () =>
        send('/steps/' + b.dataset.step, 'PATCH', { done: b.checked })));

      document.querySelectorAll('.pstate').forEach(sel => sel.addEventListener('change', () =>
        send('/parts/' + sel.dataset.part, 'PATCH', { status: sel.value })));

      document.querySelectorAll('.used').forEach(inp => inp.addEventListener('change', () => {
        const n = inp.value === '' ? null : Number(inp.value);
        send('/parts/' + inp.dataset.used, 'PATCH', { status: 'used', used_qty: n });
      }));

      // On blur, not on every keystroke: a note is written, not typed at.
      document.querySelectorAll('[data-note]').forEach(t => {
        const was = t.value;
        t.addEventListener('blur', () => {
          if (t.value !== was) send('/steps/' + t.dataset.note, 'PATCH', { note: t.value });
        });
      });

      document.getElementById('statusPick').addEventListener('change', e =>
        send('', 'PATCH', { status: e.target.value }));

      document.getElementById('renameBtn').addEventListener('click', () => {
        const name = prompt('Name this project', project.name);
        if (name && name.trim() && name.trim() !== project.name) send('', 'PATCH', { name: name.trim() });
      });

      document.getElementById('deleteBtn').addEventListener('click', async () => {
        if (!confirm('Delete "' + project.name + '"? The drawers are untouched; only the project goes.')) return;
        const res = await fetch('/projects/' + encodeURIComponent(id), { method: 'DELETE' });
        if (res.ok) location.href = '/projects.html';
        else setStatus('error', 'Could not delete it.');
      });

      document.getElementById('noteBtn').addEventListener('click', addNote);
      document.getElementById('noteText').addEventListener('keydown', e => {
        if (e.key === 'Enter') addNote();
      });

      document.getElementById('settleBtn').addEventListener('click', showSettlement);

      const docFile = document.getElementById('docFile');
      if (docFile) docFile.addEventListener('change', () => upload(docFile));
      document.querySelectorAll('[data-doc]').forEach(b => b.addEventListener('click', () => {
        if (confirm('Remove this document? The file goes unless another project keeps it too.')) {
          send('/documents/' + encodeURIComponent(b.dataset.doc), 'DELETE');
        }
      }));
    }

    async function upload(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;
      const st = document.getElementById('docStatus');
      st.className = 'status';
      st.textContent = 'Keeping ' + file.name + '…';
      const form = new FormData();
      form.append('document', file);
      try {
        const res = await fetch('/projects/' + encodeURIComponent(id) + '/documents',
          { method: 'POST', body: form });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        project = await res.json();
        render();
        setStatus('ok', 'Kept ' + file.name + '.');
      } catch (e) {
        st.className = 'status error';
        st.textContent = 'Could not keep it: ' + e.message;
      }
    }

    // One listener for every copy button, including ones drawn later.
    document.addEventListener('click', async e => {
      const btn = e.target.closest('[data-copy]');
      if (!btn) return;
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        const was = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => { btn.textContent = was; }, 1400);
      } catch (err) {
        // Clipboard refused — no permission, or not a secure context. Showing the
        // text is the fallback that always works.
        const pre = document.createElement('pre');
        pre.textContent = btn.dataset.copy;
        pre.style.cssText = 'white-space:pre-wrap;font-size:.82rem;margin:.5rem 0 0';
        btn.replaceWith(pre);
      }
    });

    async function addNote() {
      const el = document.getElementById('noteText');
      const text = el.value.trim();
      if (!text) return;
      if (await send('/notes', 'POST', { text })) { /* redrawn, box is fresh */ }
    }

    async function showSettlement() {
      const out = document.getElementById('settleOut');
      out.innerHTML = '<p class="status">Working it out…</p>';
      try {
        const res = await fetch('/projects/' + encodeURIComponent(id) + '/settle');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const s = await res.json();
        const changes = s.changes || [];
        const problems = s.problems || [];
        out.innerHTML =
          (changes.length
            ? '<table><thead><tr><th>Drawer</th><th>Item</th><th>Now</th><th>Used</th><th>Left</th></tr></thead><tbody>'
              + changes.map(c => '<tr><td><a href="/put.html?c=' + encodeURIComponent(c.container)
                  + '&s=' + encodeURIComponent(c.slot) + '">' + esc(c.container) + ' · ' + esc(c.slot) + '</a></td>'
                  + '<td>' + esc(c.item) + '</td><td class="n">' + c.before + '</td>'
                  + '<td class="n">−' + c.used + '</td><td class="n">' + c.after + '</td></tr>').join('')
              + '</tbody></table>'
            : '<p class="empty">Nothing to take out of stock. Mark the parts you used as <em>used</em>, '
              + 'and say how many, and they show up here.</p>')
          + (problems.length
            ? '<ul class="problems">' + problems.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>'
            : '')
          + (changes.length
            ? '<button class="btn primary" id="doSettle">Apply and mark the project done</button>'
              + ' <button class="btn" id="doSettleOnly">Apply, keep it open</button>'
            : '');
        if (changes.length) {
          document.getElementById('doSettle').addEventListener('click', () => applySettlement(true));
          document.getElementById('doSettleOnly').addEventListener('click', () => applySettlement(false));
        }
      } catch (e) {
        out.innerHTML = '<p class="status error">Could not work it out: ' + esc(e.message) + '</p>';
      }
    }

    async function applySettlement(finish) {
      if (!confirm('Reduce the drawers as shown? This changes your inventory.')) return;
      setStatus('', 'Settling up…');
      try {
        const res = await fetch('/projects/' + encodeURIComponent(id) + '/settle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ finish })
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const r = await res.json();
        project = r.project;
        render();
        setStatus('ok', 'Stock updated.');
      } catch (e) {
        setStatus('error', 'Could not settle up: ' + e.message);
      }
    }

    function setStatus(kind, text) {
      status.className = 'status' + (kind ? ' ' + kind : '');
      status.textContent = text;
    }
  </script>
</body>
</html>
