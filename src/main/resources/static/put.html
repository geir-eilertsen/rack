<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — add an item</title>
  <link rel="icon" type="image/svg+xml" href="/assets/rack.svg">
  <link rel="apple-touch-icon" href="/assets/rack.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d97747">
  <link rel="stylesheet" href="/assets/rack.css">
  <style>
    .current { list-style: none; padding: 0; margin: .5rem 0 0; }
    .current li { padding: .75rem .9rem; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: .5rem; background: var(--card); cursor: pointer; transition: background .12s ease, border-color .12s ease; }
    .current li:hover { background: var(--primary-soft); border-color: var(--border-strong); }
    .current li.editing { cursor: default; background: var(--card); border-color: var(--primary); box-shadow: var(--shadow); }
    .current .row { display: flex; align-items: center; gap: .5rem; }
    .current .thumb { flex: 0 0 auto; width: 48px; height: 48px; object-fit: cover; border-radius: var(--radius-xs); border: 1px solid var(--border); }
    .current .thumb-placeholder { flex: 0 0 auto; width: 48px; height: 48px; border-radius: var(--radius-xs); background: var(--primary-soft); display: flex; align-items: center; justify-content: center; color: var(--primary); }
    .current .body { flex: 1; min-width: 0; }
    .current .desc { font-size: .95rem; font-weight: 500; }
    .current .qty { font-family: var(--font-mono); font-weight: 700; color: var(--primary-hover); font-size: .95rem; }
    .current .pn-line { margin-top: .2rem; }
    .current .tags-line { margin-top: .3rem; }
    .current li.editing .row { display: none; }
    .current li.editing .pn-line, .current li.editing .tags-line { display: none; }
    .edit-form { display: none; flex-direction: column; gap: .35rem; }
    .current li.editing .edit-form { display: flex; }
    .edit-form label { font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: .35rem; }
    .edit-actions { display: flex; gap: .4rem; margin-top: .5rem; align-items: center; }
    .edit-actions .btn { flex: 1; }
    .edit-actions .remove { flex: 0 0 auto; background: transparent; border: none; color: var(--error); font-size: .85rem; cursor: pointer; padding: .3rem .5rem; text-decoration: underline; }
    .edit-actions .remove:hover { color: #7a2a20; }
    .ai { margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--border); }
    .ai h4 { margin: 0 0 .4rem; font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .ai-input { display: flex; gap: .3rem; }
    .ai-input input { flex: 1; }
    .ai-input .ask-btn { flex: 0 0 auto; padding: .55rem .9rem; }
    .empty { padding: .75rem; border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); color: var(--muted); font-size: .9rem; text-align: center; background: var(--card); }
    .manual { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .5rem .85rem .85rem; background: var(--card); margin-top: 1rem; box-shadow: var(--shadow); }
    .manual summary { cursor: pointer; font-size: .9rem; font-weight: 600; padding: .35rem 0; color: var(--text); }
    .manual summary:hover { color: var(--primary-hover); }
    .sug-list { list-style: none; padding: 0; margin: 0; }
    .sug { padding: .8rem .9rem; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: .5rem; background: var(--card); box-shadow: var(--shadow); }
    .sug.top { border-color: var(--primary); background: var(--primary-soft); }
    .sug .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .3rem; }
    .sug .loc { font-family: var(--font-mono); font-weight: 700; font-size: 1rem; }
    .sug .why { font-size: .8rem; color: var(--muted); margin-bottom: .4rem; }
    .none { padding: .6rem .85rem; color: var(--muted); font-size: .85rem; font-style: italic; }
    .pending { display: flex; gap: .55rem; flex-wrap: wrap; margin-top: 1rem; }
    .pending .shot { position: relative; line-height: 0; }
    .pending img { width: 88px; height: 88px; object-fit: cover; display: block; border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow); }
    .pending .drop { position: absolute; top: -7px; right: -7px; width: 23px; height: 23px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); border-radius: 50%; background: var(--card); color: var(--error); font-size: .95rem; line-height: 1; cursor: pointer; }
    .pending .drop:hover { background: var(--error); border-color: var(--error); color: #fff; }
    .items.extracted { list-style: none; padding: 0; margin: 0; }
    .items.extracted li { padding: .5rem .75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: .35rem; background: var(--card); font-size: .9rem; }
    .items.extracted .pn { display: inline; margin-left: .35rem; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <a class="back" href="/">← Home</a>
      <a class="brand" href="/">
        <img class="logo" src="/assets/rack.svg" alt="">
        <span class="name">rack</span>
      </a>
    </header>

    <h1 id="title">Add an item</h1>

    <div id="slotHeader" class="slot-header" hidden></div>

    <h2 id="currentHeading" hidden>What's already here</h2>
    <ul class="current" id="current"></ul>

    <h2 id="captureHeading">Take a photo</h2>
    <label class="capture">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
      <span id="captureLabel">Take a photo</span>
      <input type="file" accept="image/*" capture="environment" multiple id="photo">
    </label>

    <div id="pending" class="pending"></div>
    <button class="btn primary block" id="fileBtn" style="margin-top:.75rem" hidden></button>
    <div class="status" id="status"></div>

    <h2 id="extractedHeading" hidden>What I see</h2>
    <ul class="items extracted" id="extracted"></ul>

    <h2 id="pickHeading" hidden>Where does it go?</h2>
    <ul class="sug-list" id="suggestions"></ul>

    <details class="manual" id="manual" open>
      <summary id="manualSummary">Or pick a slot manually</summary>
      <div class="picker-label">Container</div>
      <div class="containers" id="containers"></div>
      <div class="picker-label" id="slotsLabel" hidden>Slot</div>
      <div class="slots-legend" id="slotsLegend" hidden><span><span class="swatch empty"></span>empty</span><span><span class="swatch filled"></span>has items</span></div>
      <div class="slots-grid" id="slots"></div>
      <button class="btn primary block" id="fileManual" style="margin-top:.75rem" hidden>File in selected slot</button>
    </details>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const preC = params.get('c');
    const preS = params.get('s');

    const title = document.getElementById('title');
    const slotHeader = document.getElementById('slotHeader');
    const currentHeading = document.getElementById('currentHeading');
    const currentEl = document.getElementById('current');
    const captureHeading = document.getElementById('captureHeading');
    const captureLabel = document.getElementById('captureLabel');
    const photo = document.getElementById('photo');
    const pendingEl = document.getElementById('pending');
    const fileBtn = document.getElementById('fileBtn');
    const status = document.getElementById('status');
    const extractedHeading = document.getElementById('extractedHeading');
    const extractedEl = document.getElementById('extracted');
    const pickHeading = document.getElementById('pickHeading');
    const suggestionsEl = document.getElementById('suggestions');
    const manual = document.getElementById('manual');
    const containersEl = document.getElementById('containers');
    const slotsLabel = document.getElementById('slotsLabel');
    const slotsLegend = document.getElementById('slotsLegend');
    const slotsEl = document.getElementById('slots');
    const fileManualBtn = document.getElementById('fileManual');

    let containers = [];
    let selectedContainer = null;
    let selectedSlot = null;
    // Photos of one slot are collected here and filed as a batch, so a part and
    // its label go into a single extraction instead of being indexed twice.
    let pendingPhotos = [];

    init();

    async function init() {
      try {
        const res = await fetch('/c');
        containers = await res.json();
        renderContainerPicker();
      } catch (e) {
        setStatus('error', 'Failed to load containers: ' + e.message);
        return;
      }
      if (preC) {
        const c = containers.find(x => x.id === preC);
        if (c) {
          selectContainer(c, false);
          if (preS && (c.slots || []).includes(preS)) selectSlot(preS, false);
          manual.open = false;
        }
      }
      refreshUiForSelection();
    }

    function refreshUiForSelection() {
      const hasSlot = !!(selectedContainer && selectedSlot);
      if (hasSlot) {
        title.textContent = 'Slot ' + selectedContainer.id + ' · ' + selectedSlot;
        slotHeader.hidden = false;
        slotHeader.textContent = selectedContainer.id + ' · ' + selectedSlot;
        currentHeading.hidden = false;
        captureHeading.textContent = pendingPhotos.length ? 'Photos of this slot' : 'Add a photo';
        // Keep the manual picker visible while photos are waiting to be filed
        // (so the "File in X.Y" button inside it stays reachable); otherwise
        // hide since the user is just viewing this slot.
        manual.hidden = !pendingPhotos.length;
        if (!pendingPhotos.length) manual.open = false;
        loadCurrent();
      } else {
        title.textContent = 'Add an item';
        slotHeader.hidden = true;
        currentHeading.hidden = true;
        currentEl.innerHTML = '';
        captureHeading.textContent = pendingPhotos.length ? 'Photos to file' : 'Take a photo';
        manual.hidden = false;
      }
      updateCaptureLabel();
      updateFileBtn();
      updateManualFileBtn();
    }

    function updateCaptureLabel() {
      if (pendingPhotos.length) {
        captureLabel.textContent = 'Add another photo';
        return;
      }
      captureLabel.textContent = selectedContainer && selectedSlot
        ? 'Take a photo of what\'s in ' + selectedContainer.id + '.' + selectedSlot
        : 'Take a photo';
    }

    function updateFileBtn() {
      const n = pendingPhotos.length;
      if (!n) {
        fileBtn.hidden = true;
        return;
      }
      fileBtn.hidden = false;
      fileBtn.disabled = false;
      const photos = n + ' photo' + (n === 1 ? '' : 's');
      fileBtn.textContent = selectedContainer && selectedSlot
        ? 'File ' + photos + ' in ' + selectedContainer.id + '.' + selectedSlot
        : 'Identify ' + photos;
    }

    function renderPending() {
      pendingEl.innerHTML = '';
      pendingPhotos.forEach((p, idx) => {
        const shot = document.createElement('div');
        shot.className = 'shot';
        const img = document.createElement('img');
        img.src = p.url;
        img.alt = 'photo ' + (idx + 1);
        const drop = document.createElement('button');
        drop.type = 'button';
        drop.className = 'drop';
        drop.title = 'Drop this photo';
        drop.textContent = '×';
        drop.addEventListener('click', () => dropPending(idx));
        shot.append(img, drop);
        pendingEl.appendChild(shot);
      });
    }

    function dropPending(idx) {
      URL.revokeObjectURL(pendingPhotos[idx].url);
      pendingPhotos.splice(idx, 1);
      renderPending();
      updateCaptureLabel();
      updateFileBtn();
      updateManualFileBtn();
      if (!pendingPhotos.length) {
        setStatus('', '');
        refreshUiForSelection();
      }
    }

    function clearPending() {
      pendingPhotos.forEach(p => URL.revokeObjectURL(p.url));
      pendingPhotos = [];
      renderPending();
    }

    async function loadCurrent() {
      currentEl.innerHTML = '<li class="empty">Loading...</li>';
      try {
        const res = await fetch('/c/' + selectedContainer.id + '/' + selectedSlot);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const slot = await res.json();
        renderCurrent(slot.items || []);
      } catch (e) {
        currentEl.innerHTML = '<li class="empty">Failed to load: ' + esc(e.message) + '</li>';
      }
    }

    function photoUrl(fn) {
      return '/c/' + encodeURIComponent(selectedContainer.id) + '/' + encodeURIComponent(selectedSlot) + '/photos/' + encodeURIComponent(fn);
    }

    function renderCurrent(list) {
      if (!list.length) {
        currentEl.innerHTML = '<li class="empty">Nothing here yet.</li>';
        return;
      }
      currentEl.innerHTML = list.map((it, idx) => renderItemRow(it, idx)).join('');
      currentEl.querySelectorAll('li').forEach((li, idx) => {
        li.addEventListener('click', ev => {
          if (li.classList.contains('editing')) return;
          if (ev.target.closest('.edit-form')) return;
          li.classList.add('editing');
        });
      });
      currentEl.querySelectorAll('.cancel').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); b.closest('li').classList.remove('editing'); }));
      currentEl.querySelectorAll('.save').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); saveEdit(b.closest('li')); }));
      currentEl.querySelectorAll('.remove').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); removeItem(b.closest('li')); }));
      currentEl.querySelectorAll('.ask-btn').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); askItem(b.closest('li')); }));
      currentEl.querySelectorAll('.ai-q').forEach(inp => inp.addEventListener('click', e => e.stopPropagation()));
      currentEl.querySelectorAll('.move-panel').forEach(panel => wireMovePanel(panel));
    }

    function wireMovePanel(panel) {
      const containersHost = panel.querySelector('.move-containers');
      const slotsHost = panel.querySelector('.move-slots');
      const moveBtn = panel.querySelector('.move-btn');
      let picked = { container: null, slot: null };

      panel.addEventListener('click', ev => ev.stopPropagation());
      panel.addEventListener('toggle', () => {
        if (panel.open && !containersHost.children.length) drawContainers();
      });

      function drawContainers() {
        containersHost.innerHTML = '';
        containers.forEach(c => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'container-btn';
          btn.textContent = c.name || c.id;
          btn.addEventListener('click', ev => { ev.stopPropagation(); pickContainer(c, btn); });
          containersHost.appendChild(btn);
        });
      }

      async function pickContainer(c, btn) {
        picked.container = c;
        picked.slot = null;
        containersHost.querySelectorAll('.container-btn').forEach(el => el.classList.toggle('selected', el === btn));
        slotsHost.innerHTML = '<span style="font-size:.8rem;color:var(--muted)">Loading…</span>';
        moveBtn.disabled = true;
        moveBtn.textContent = 'Pick a destination';
        let filled = new Set();
        try {
          const res = await fetch('/c/' + c.id + '/summary');
          if (res.ok) {
            const summary = await res.json();
            filled = new Set(summary.filter(s => s.item_count > 0).map(s => s.slot));
          }
        } catch (e) { /* ignore */ }
        drawSlots(c, filled);
      }

      function drawSlots(c, filled) {
        slotsHost.innerHTML = '';
        (c.slots || []).forEach(sid => {
          const isCurrent = selectedContainer && c.id === selectedContainer.id && sid === selectedSlot;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'slot-btn' + (filled.has(sid) ? ' filled' : '') + (isCurrent ? ' selected' : '');
          btn.textContent = sid;
          btn.disabled = isCurrent;
          if (isCurrent) btn.title = 'current slot';
          btn.addEventListener('click', ev => { ev.stopPropagation(); pickSlot(sid, btn); });
          slotsHost.appendChild(btn);
        });
      }

      function pickSlot(sid, btn) {
        picked.slot = sid;
        slotsHost.querySelectorAll('.slot-btn').forEach(el => el.classList.toggle('selected', el === btn));
        moveBtn.disabled = false;
        moveBtn.textContent = 'Move to ' + picked.container.id + '.' + sid;
      }

      moveBtn.addEventListener('click', async ev => {
        ev.stopPropagation();
        if (!picked.container || !picked.slot) return;
        const li = panel.closest('li');
        const idx = +li.dataset.idx;
        const original = moveBtn.textContent;
        moveBtn.disabled = true;
        moveBtn.textContent = 'Moving…';
        try {
          const res = await fetch('/c/' + selectedContainer.id + '/' + selectedSlot + '/items/' + idx + '/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target_container: picked.container.id, target_slot: picked.slot })
          });
          if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
          setStatus('ok', '✓ Moved to ' + picked.container.id + '.' + picked.slot + '.');
          loadCurrent();
        } catch (e) {
          setStatus('error', 'Move failed: ' + e.message);
          moveBtn.disabled = false;
          moveBtn.textContent = original;
        }
      });
    }

    async function askItem(li) {
      const idx = +li.dataset.idx;
      const input = li.querySelector('.ai-q');
      const question = input.value.trim();
      if (!question) return;
      const askBtn = li.querySelector('.ask-btn');
      askBtn.disabled = true;
      askBtn.textContent = '…';
      try {
        const res = await fetch('/c/' + selectedContainer.id + '/' + selectedSlot + '/items/' + idx + '/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const slot = await res.json();
        const latestItem = slot.items[idx];
        const latestQA = (latestItem.qa || []).slice(-1)[0];
        appendQaEntry(li, latestQA);
      } catch (e) {
        setStatus('error', 'Ask failed: ' + e.message);
      } finally {
        askBtn.disabled = false;
        askBtn.textContent = 'Ask';
        input.value = '';
        input.focus();
      }
    }

    function appendQaEntry(li, entry) {
      if (!entry) return;
      const ai = li.querySelector('.ai');
      let log = ai.querySelector('.qa-log');
      if (!log) {
        log = document.createElement('ul');
        log.className = 'qa-log';
        ai.insertBefore(log, ai.querySelector('.ai-input'));
      }
      const item = document.createElement('li');
      item.innerHTML = '<div class="q">Q: ' + esc(entry.question) + '</div><div class="a">' + md(entry.answer) + '</div>';
      log.appendChild(item);
    }

    function renderItemRow(it, idx) {
      const tags = (it.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
      const qty = it.qty_estimate == null ? 1 : it.qty_estimate;
      const tagsCsv = (it.tags || []).join(', ');
      const thumb = it.source_photo
        ? '<a href="' + photoUrl(it.source_photo) + '" target="_blank" onclick="event.stopPropagation()"><img class="thumb" src="' + photoUrl(it.source_photo) + '" alt=""></a>'
        : '<div class="thumb-placeholder" title="no photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div>';
      return '<li data-idx="' + idx + '">' +
        '<div class="row">' +
          thumb +
          '<div class="body">' +
            '<div class="desc">' + esc(it.description || '(unknown)') + '</div>' +
            (it.part_number ? '<div class="pn-line pn">' + esc(it.part_number) + '</div>' : '') +
            (tags ? '<div class="tags-line">' + tags + '</div>' : '') +
          '</div>' +
          '<div class="qty">×' + qty + '</div>' +
        '</div>' +
        '<div class="edit-form">' +
          '<label>Description</label><input class="f-description" value="' + esc(it.description || '') + '">' +
          '<label>Part number</label><input class="f-part_number" value="' + esc(it.part_number || '') + '">' +
          '<label>Category</label><input class="f-category" value="' + esc(it.category || '') + '">' +
          '<label>Quantity</label><input class="f-qty_estimate" type="number" min="0" value="' + qty + '">' +
          '<label>Tags (comma separated)</label><input class="f-tags" value="' + esc(tagsCsv) + '">' +
          '<div class="edit-actions">' +
            '<button class="btn cancel">Cancel</button>' +
            '<button class="btn primary save">Save</button>' +
            '<button class="remove" title="Remove this item">Remove</button>' +
          '</div>' +
          '<div class="ai">' +
            '<h4>Ask AI about this item</h4>' +
            renderQaLog(it.qa || []) +
            '<div class="ai-input">' +
              '<input class="ai-q" type="text" placeholder="e.g. what is this pin?">' +
              '<button class="btn ask-btn">Ask</button>' +
            '</div>' +
          '</div>' +
          '<details class="move-panel">' +
            '<summary>Move to another slot…</summary>' +
            '<div class="move-body">' +
              '<div class="picker-label">Container</div>' +
              '<div class="containers move-containers"></div>' +
              '<div class="picker-label">Slot</div>' +
              '<div class="slots-grid move-slots"></div>' +
              '<button class="btn primary move-btn" disabled>Pick a destination</button>' +
            '</div>' +
          '</details>' +
        '</div>' +
      '</li>';
    }

    function renderQaLog(qa) {
      if (!qa.length) return '';
      const recent = qa.slice(-2);
      const older = qa.slice(0, -2);
      const olderHtml = older.length
        ? '<details class="qa-history"><summary>Show ' + older.length + ' earlier question' + (older.length === 1 ? '' : 's') + '</summary>' +
            '<ul class="qa-log">' + older.map(qaItem).join('') + '</ul>' +
          '</details>'
        : '';
      return olderHtml + '<ul class="qa-log">' + recent.map(qaItem).join('') + '</ul>';
    }

    function qaItem(x) {
      return '<li><div class="q">Q: ' + esc(x.question) + '</div><div class="a">' + md(x.answer) + '</div></li>';
    }

    function md(text) {
      const escaped = esc(text);
      const blocks = escaped.split(/\n\s*\n/);
      return blocks.map(renderBlock).join('');
    }

    function renderBlock(block) {
      const trimmed = block.trim();
      if (!trimmed) return '';
      if (/^---+$/.test(trimmed)) return '<hr>';
      const heading = trimmed.match(/^(#{1,4})\s+(.+)$/);
      if (heading && !trimmed.includes('\n')) {
        const level = heading[1].length;
        return '<h' + level + '>' + inline(heading[2]) + '</h' + level + '>';
      }
      const lines = trimmed.split('\n');
      if (lines.every(l => /^\s*[-*]\s+/.test(l))) {
        return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*]\s+/, '')) + '</li>').join('') + '</ul>';
      }
      return '<p>' + inline(trimmed).replace(/\n/g, '<br>') + '</p>';
    }

    function inline(s) {
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      return s;
    }

    async function saveEdit(li) {
      const idx = +li.dataset.idx;
      const payload = {
        description: li.querySelector('.f-description').value,
        part_number: li.querySelector('.f-part_number').value || null,
        category: li.querySelector('.f-category').value,
        qty_estimate: parseInt(li.querySelector('.f-qty_estimate').value, 10) || 0,
        tags: li.querySelector('.f-tags').value.split(',').map(s => s.trim()).filter(Boolean)
      };
      if (payload.qty_estimate <= 0) {
        return removeItem(li);
      }
      try {
        const res = await fetch('/c/' + selectedContainer.id + '/' + selectedSlot + '/items/' + idx, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const slot = await res.json();
        renderCurrent(slot.items || []);
      } catch (e) {
        setStatus('error', 'Save failed: ' + e.message);
      }
    }

    async function removeItem(li) {
      const idx = +li.dataset.idx;
      try {
        const res = await fetch('/c/' + selectedContainer.id + '/' + selectedSlot + '/items/' + idx, { method: 'DELETE' });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const slot = await res.json();
        renderCurrent(slot.items || []);
      } catch (e) {
        setStatus('error', 'Remove failed: ' + e.message);
      }
    }

    photo.addEventListener('change', async () => {
      const files = Array.from(photo.files || []);
      if (!files.length) return;
      photo.value = '';

      // Status first so mobile paints before the resize work starts.
      extractedEl.innerHTML = '';
      suggestionsEl.innerHTML = '';
      extractedHeading.hidden = true;
      pickHeading.hidden = true;
      setStatus('', files.length === 1 ? 'Preparing photo…' : 'Preparing ' + files.length + ' photos…');
      // Yield a frame so the paint above lands before we start heavy work.
      await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));

      for (const file of files) {
        const resized = await resize(file);
        pendingPhotos.push({ file: resized, url: URL.createObjectURL(resized) });
        renderPending();
      }

      refreshUiForSelection();
      const n = pendingPhotos.length;
      setStatus('', n + ' photo' + (n === 1 ? '' : 's') + ' ready — add the label or another angle, or file '
        + (n === 1 ? 'it' : 'them') + ' now.');
    });

    fileBtn.addEventListener('click', () => {
      if (!pendingPhotos.length) return;
      if (selectedContainer && selectedSlot) {
        fileToPicked(selectedContainer.id, selectedSlot, fileBtn);
      } else {
        suggestAndPick();
      }
    });

    function appendPending(form) {
      // One field name repeated: the server binds it as the batch.
      pendingPhotos.forEach(p => form.append('photo', p.file));
    }

    async function suggestAndPick() {
      fileBtn.disabled = true;
      setStatus('', 'Identifying...');
      const form = new FormData();
      appendPending(form);
      try {
        const res = await fetch('/suggest', { method: 'POST', body: form });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const data = await res.json();
        renderExtracted(data.extracted || []);
        renderSuggestions(data.suggestions || []);
        pickHeading.hidden = false;
        manual.open = !(data.suggestions && data.suggestions.length);
        setStatus('ok', 'Ready to file.');
      } catch (e) {
        setStatus('error', 'Failed: ' + e.message);
      } finally {
        updateFileBtn();
      }
    }

    function renderExtracted(list) {
      extractedHeading.hidden = list.length === 0;
      extractedEl.innerHTML = list.map(it => {
        return '<li><strong>' + esc(it.description || '(unknown)') + '</strong>' +
          (it.part_number ? '<span class="pn">' + esc(it.part_number) + '</span>' : '') +
        '</li>';
      }).join('');
    }

    function renderSuggestions(sugs) {
      if (!sugs.length) {
        suggestionsEl.innerHTML = '<li class="none">No similar slots found. Pick a slot below.</li>';
        return;
      }
      suggestionsEl.innerHTML = sugs.map((s, i) => {
        const matches = (s.matches || []).slice(0, 3)
          .map(m => esc(m.description || '?'))
          .join('; ');
        return '<li class="sug' + (i === 0 ? ' top' : '') + '">' +
          '<div class="head"><span class="loc">' + esc(s.container) + ' · ' + esc(s.slot) + '</span></div>' +
          (matches ? '<div class="why">has: ' + matches + '</div>' : '') +
          '<button class="btn primary block" data-c="' + esc(s.container) + '" data-s="' + esc(s.slot) + '">File here</button>' +
        '</li>';
      }).join('');
      suggestionsEl.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => fileToPicked(btn.dataset.c, btn.dataset.s, btn));
      });
    }

    function renderContainerPicker() {
      containersEl.innerHTML = '';
      containers.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'container-btn';
        btn.textContent = c.name || c.id;
        btn.addEventListener('click', () => selectContainer(c, true));
        containersEl.appendChild(btn);
      });
    }

    async function selectContainer(c, refreshUi) {
      selectedContainer = c;
      selectedSlot = null;
      document.querySelectorAll('.container-btn').forEach(el => el.classList.toggle('selected', el.textContent === (c.name || c.id)));
      slotsLabel.hidden = false;
      slotsLegend.hidden = false;
      renderSlotPicker(c.slots || [], new Set());
      if (refreshUi) {
        updateManualFileBtn();
        refreshUiForSelection();
      }
      // Load per-slot state and repaint the picker with filled markers.
      try {
        const res = await fetch('/c/' + c.id + '/summary');
        if (res.ok) {
          const summary = await res.json();
          const filled = new Set(summary.filter(s => s.item_count > 0).map(s => s.slot));
          renderSlotPicker(c.slots || [], filled);
          if (selectedSlot) {
            slotsEl.querySelectorAll('.slot-btn').forEach(el => el.classList.toggle('selected', el.dataset.slot === selectedSlot));
          }
        }
      } catch (e) { /* summary is nice-to-have; keep picker without markers */ }
    }

    function renderSlotPicker(slots, filledSet) {
      slotsEl.innerHTML = '';
      slots.forEach(sid => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'slot-btn' + (filledSet && filledSet.has(sid) ? ' filled' : '');
        btn.textContent = sid;
        btn.dataset.slot = sid;
        btn.addEventListener('click', () => selectSlot(sid, true));
        slotsEl.appendChild(btn);
      });
    }

    function selectSlot(sid, userDriven) {
      selectedSlot = sid;
      slotsEl.querySelectorAll('.slot-btn').forEach(el => el.classList.toggle('selected', el.dataset.slot === sid));
      updateManualFileBtn();
      if (userDriven) refreshUiForSelection();
    }

    function updateManualFileBtn() {
      const ready = !!(selectedContainer && selectedSlot && pendingPhotos.length);
      fileManualBtn.hidden = !ready;
      if (ready) {
        const n = pendingPhotos.length;
        fileManualBtn.textContent = 'File ' + n + ' photo' + (n === 1 ? '' : 's')
          + ' in ' + selectedContainer.id + '.' + selectedSlot;
      }
    }

    fileManualBtn.addEventListener('click', () => {
      if (selectedContainer && selectedSlot && pendingPhotos.length) {
        fileToPicked(selectedContainer.id, selectedSlot, fileManualBtn);
      }
    });

    async function fileToPicked(containerId, slotId, triggerBtn) {
      if (!pendingPhotos.length) { setStatus('error', 'No photos to file.'); return; }
      const count = pendingPhotos.length;
      const originalText = triggerBtn ? triggerBtn.textContent : '';
      const allBtns = [];
      suggestionsEl.querySelectorAll('button').forEach(b => { b.disabled = true; allBtns.push(b); });
      if (fileManualBtn && !fileManualBtn.disabled) { fileManualBtn.disabled = true; allBtns.push(fileManualBtn); }
      if (fileBtn && !fileBtn.disabled) { fileBtn.disabled = true; allBtns.push(fileBtn); }
      if (triggerBtn) triggerBtn.textContent = 'Filing…';
      setStatus('', 'Filing ' + count + ' photo' + (count === 1 ? '' : 's') + ' into '
        + containerId + '.' + slotId + ' — Claude is extracting…');
      const form = new FormData();
      appendPending(form);
      try {
        const url = '/c/' + containerId + '/' + slotId + '/photo';
        const res = await fetch(url, { method: 'POST', body: form });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const data = await res.json();
        const items = (data.extracted || []).length;
        setStatus('ok', '✓ Filed ' + items + ' item' + (items === 1 ? '' : 's') + ' from '
          + count + ' photo' + (count === 1 ? '' : 's') + ' into ' + containerId + '.' + slotId + '.');
        clearPending();
        suggestionsEl.innerHTML = '';
        pickHeading.hidden = true;
        selectedContainer = containers.find(c => c.id === containerId) || selectedContainer;
        selectedSlot = slotId;
        refreshUiForSelection();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        setStatus('error', 'Failed: ' + e.message);
        allBtns.forEach(b => b.disabled = false);
        if (triggerBtn) triggerBtn.textContent = originalText;
        updateFileBtn();
      }
    }

    function setStatus(kind, text) {
      status.className = 'status' + (kind ? ' ' + kind : '');
      status.textContent = text;
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function resize(file, maxDim = 1600, quality = 0.85) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
      if (scale >= 1 && file.size < 3_000_000) return file;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return new Promise(resolve => canvas.toBlob(b => resolve(new File([b], 'photo.jpg', { type: 'image/jpeg' })), 'image/jpeg', quality));
    }
  </script>
</body>
</html>
