<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — add to slot</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 640px; color: #222; }
    .back { color: #666; text-decoration: none; font-size: .85rem; }
    .back:hover { color: #222; }
    h1 { font-size: 1.2rem; margin: .25rem 0 1rem; }
    h2 { font-size: .85rem; color: #666; margin: 1.2rem 0 .5rem; text-transform: uppercase; letter-spacing: .05em; }
    .containers { display: flex; flex-wrap: wrap; gap: .3rem; }
    .container-btn { padding: .5rem .9rem; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font: inherit; font-size: .9rem; }
    .container-btn:hover { background: #f0f0f0; }
    .container-btn.selected { background: #333; color: #fff; border-color: #333; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: .3rem; }
    .slot-btn { padding: .55rem 0; text-align: center; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font: inherit; font-size: .8rem; }
    .slot-btn:hover { background: #f0f0f0; }
    .slot-btn.selected { background: #333; color: #fff; border-color: #333; }
    .capture { display: block; width: 100%; padding: 1.4rem; font-size: 1rem; border: 2px dashed #666; border-radius: 8px; text-align: center; background: #f8f8f8; cursor: pointer; box-sizing: border-box; }
    .capture[hidden] { display: none; }
    .capture input { display: none; }
    #preview img { max-width: 100%; border-radius: 8px; display: block; margin-top: 1rem; }
    .status { margin-top: 1rem; color: #666; }
    .status.error { color: #b00020; }
    .status.ok { color: #0a7f00; }
    .items { list-style: none; padding: 0; margin: .5rem 0 0; }
    .item { padding: .75rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: .5rem; }
    .item h3 { margin: 0 0 .25rem; font-size: 1rem; }
    .pn { font-family: ui-monospace, SFMono-Regular, monospace; color: #444; margin-bottom: .25rem; }
    .meta { font-size: .8rem; color: #666; }
    .tags { margin-top: .25rem; }
    .tag { display: inline-block; background: #eef; padding: .1rem .5rem; border-radius: 999px; margin: .1rem .1rem 0 0; font-size: .75rem; }
    .current { list-style: none; padding: 0; margin: .5rem 0 0; }
    .current li { display: flex; justify-content: space-between; align-items: flex-start; padding: .55rem .75rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: .35rem; gap: .5rem; }
    .current .info { flex: 1; min-width: 0; font-size: .9rem; }
    .current .info strong { display: block; }
    .current .info .pn { font-size: .8rem; }
    .current .remove { flex: 0 0 auto; border: none; background: transparent; color: #b00020; font-size: 1.4rem; line-height: 1; cursor: pointer; padding: 0 .4rem; }
    .current .remove:hover { color: #700018; }
    .current .empty { padding: .55rem .75rem; border: 1px dashed #ccc; border-radius: 6px; color: #666; font-size: .85rem; }
  </style>
</head>
<body>
  <a class="back" href="/">&larr; rack</a>
  <h1>add to slot</h1>

  <h2 id="containerHeading">1. pick a container</h2>
  <div class="containers" id="containers"></div>

  <h2 id="slotHeading" hidden>2. pick a slot</h2>
  <div class="grid" id="slots"></div>

  <h2 id="currentHeading" hidden>currently in this slot</h2>
  <ul class="current" id="current"></ul>

  <h2 id="photoHeading" hidden>3. take a photo</h2>
  <label class="capture" hidden id="capture">
    Take a photo
    <input type="file" accept="image/*" capture="environment" id="photo">
  </label>

  <div id="preview"></div>
  <div class="status" id="status"></div>
  <ul class="items" id="items"></ul>

  <script>
    const containersEl = document.getElementById('containers');
    const containerHeading = document.getElementById('containerHeading');
    const slotHeading = document.getElementById('slotHeading');
    const slotsEl = document.getElementById('slots');
    const currentHeading = document.getElementById('currentHeading');
    const currentEl = document.getElementById('current');
    const photoHeading = document.getElementById('photoHeading');
    const capture = document.getElementById('capture');
    const photo = document.getElementById('photo');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');
    const items = document.getElementById('items');

    let selectedContainer = null;
    let selectedSlot = null;

    const params = new URLSearchParams(location.search);
    const preC = params.get('c');
    const preS = params.get('s');

    init();

    async function init() {
      try {
        const res = await fetch('/c');
        const containers = await res.json();
        renderContainers(containers);
        if (preC) {
          const c = containers.find(x => x.id === preC);
          if (c) selectContainer(c);
        } else if (containers.length === 1) {
          selectContainer(containers[0]);
        }
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Failed to load containers: ' + e.message;
      }
    }

    function renderContainers(containers) {
      containersEl.innerHTML = '';
      containers.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'container-btn';
        btn.textContent = c.name || c.id;
        btn.addEventListener('click', () => selectContainer(c));
        containersEl.appendChild(btn);
      });
    }

    function selectContainer(c) {
      selectedContainer = c;
      selectedSlot = null;
      photo.value = '';
      document.querySelectorAll('.container-btn').forEach((el, i) => {
        el.classList.toggle('selected', el.textContent === (c.name || c.id));
      });
      slotHeading.hidden = false;
      renderSlots(c.slots || []);
      currentHeading.hidden = true;
      currentEl.innerHTML = '';
      photoHeading.hidden = true;
      capture.hidden = true;
      preview.innerHTML = '';
      items.innerHTML = '';
      status.className = 'status';
      status.textContent = '';
      if (preS && (c.slots || []).includes(preS)) {
        selectSlot(preS);
      }
    }

    function renderSlots(slots) {
      slotsEl.innerHTML = '';
      slots.forEach(sid => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'slot-btn';
        btn.textContent = sid;
        btn.dataset.slot = sid;
        btn.addEventListener('click', () => selectSlot(sid));
        slotsEl.appendChild(btn);
      });
    }

    function selectSlot(sid) {
      selectedSlot = sid;
      photo.value = '';
      slotsEl.querySelectorAll('.slot-btn').forEach(el => el.classList.toggle('selected', el.dataset.slot === sid));
      photoHeading.hidden = false;
      capture.hidden = false;
      preview.innerHTML = '';
      items.innerHTML = '';
      status.className = 'status';
      status.textContent = '';
      loadCurrent();
    }

    async function loadCurrent() {
      if (!selectedContainer || !selectedSlot) return;
      currentHeading.hidden = false;
      currentEl.innerHTML = '<li class="empty">Loading...</li>';
      try {
        const res = await fetch('/c/' + selectedContainer.id + '/' + selectedSlot);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const slot = await res.json();
        renderCurrent(slot.items || []);
      } catch (e) {
        currentEl.innerHTML = '<li class="empty">Failed to load: ' + esc(e.message) + '</li>';
      }
    }

    function renderCurrent(list) {
      if (!list.length) {
        currentEl.innerHTML = '<li class="empty">Empty.</li>';
        return;
      }
      currentEl.innerHTML = list.map((it, idx) => {
        const label = esc(it.description || '(unknown)')
          + (it.part_number ? ' <span class="pn">' + esc(it.part_number) + '</span>' : '');
        return '<li>' +
          '<div class="info"><strong>' + label + '</strong></div>' +
          '<button class="remove" data-idx="' + idx + '" title="remove">&times;</button>' +
        '</li>';
      }).join('');
      currentEl.querySelectorAll('.remove').forEach(btn => {
        btn.addEventListener('click', () => removeItem(parseInt(btn.dataset.idx, 10)));
      });
    }

    async function removeItem(idx) {
      if (!selectedContainer || !selectedSlot) return;
      try {
        const res = await fetch('/c/' + selectedContainer.id + '/' + selectedSlot + '/items/' + idx, { method: 'DELETE' });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const slot = await res.json();
        renderCurrent(slot.items || []);
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Remove failed: ' + e.message;
      }
    }

    photo.addEventListener('change', async () => {
      const file = photo.files[0];
      if (!file || !selectedContainer || !selectedSlot) return;

      preview.innerHTML = '<img src="' + URL.createObjectURL(file) + '">';
      items.innerHTML = '';
      status.className = 'status';
      status.textContent = 'Uploading and identifying...';

      const form = new FormData();
      form.append('photo', await resize(file));
      try {
        const url = '/c/' + selectedContainer.id + '/' + selectedSlot + '/photo';
        const res = await fetch(url, { method: 'POST', body: form });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const data = await res.json();
        const extracted = data.extracted || [];
        status.className = 'status ok';
        status.textContent = 'Filed ' + extracted.length + ' item(s) into ' + selectedContainer.id + '.' + selectedSlot + ' (photo: ' + data.photo_filename + ')';
        items.innerHTML = extracted.map(renderItem).join('');
        loadCurrent();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Failed: ' + e.message;
      }
    });

    function renderItem(it) {
      const tags = (it.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
      const conf = it.confidence != null ? Math.round(it.confidence * 100) + '%' : '?';
      const qty = it.qty_estimate != null ? it.qty_estimate : '?';
      return '<li class="item">' +
        '<h3>' + esc(it.description || '(unknown)') + '</h3>' +
        (it.part_number ? '<div class="pn">' + esc(it.part_number) + '</div>' : '') +
        '<div class="meta">' + esc(it.category || '') + ' &middot; qty ' + qty + ' &middot; conf ' + conf + '</div>' +
        (tags ? '<div class="tags">' + tags + '</div>' : '') +
      '</li>';
    }
    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function resize(file, maxDim = 1600, quality = 0.85) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
      if (scale >= 1 && file.size < 3_000_000) return file;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      return new Promise(resolve => canvas.toBlob(b => resolve(new File([b], 'photo.jpg', { type: 'image/jpeg' })), 'image/jpeg', quality));
    }
  </script>
</body>
</html>
