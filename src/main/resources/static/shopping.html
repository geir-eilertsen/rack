<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — shopping list</title>
  <link rel="icon" type="image/svg+xml" href="/assets/rack.svg">
  <link rel="apple-touch-icon" href="/assets/rack.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d97747">
  <link rel="stylesheet" href="/assets/rack.css">
  <script src="/assets/camera.js"></script>
  <script src="/assets/route.js"></script>
  <script src="/assets/shopping.js"></script>
  <script src="/assets/brands.js"></script>
  <script src="/assets/dialog.js"></script>
  <style>
    /* At the store, the store is the filter: tap "Leroy" and the page is what
       to pick up there, plus what can be bought anywhere. */
    .stores { display: flex; flex-wrap: wrap; gap: .3rem; margin: 0 0 1rem; }
    .stores .container-btn.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .stores .n { opacity: .7; font-weight: 400; margin-left: .25rem; }

    .add { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
      box-shadow: var(--shadow); padding: .8rem 1rem; margin-bottom: 1.25rem; }
    .add summary { cursor: pointer; font-weight: 700; list-style: none; }
    .add summary::-webkit-details-marker { display: none; }
    .add[open] summary { margin-bottom: .7rem; }
    .add form { display: flex; flex-direction: column; gap: .45rem; }
    .add input, .add textarea { font-size: 1rem; padding: .6rem .7rem; width: 100%; box-sizing: border-box; }
    .add .pair { display: flex; gap: .45rem; }
    .add .pair > * { flex: 1; min-width: 0; }
    .add .photo-line { display: flex; align-items: center; gap: .6rem; font-size: .9rem; color: var(--muted); }
    .add .read-hint { margin: 0; font-size: .85rem; color: var(--muted); }
    .add .read-hint b { color: var(--text); }
    .add .photo-line .drop { border: none; background: none; color: var(--muted); font-size: 1.1rem; cursor: pointer; }

    .group-title { font-size: .8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      color: var(--muted); margin: 1.1rem 0 .4rem; }
    .entries { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: .5rem; }
    .entry { display: flex; gap: .75rem; padding: .7rem; border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--card); box-shadow: var(--shadow); align-items: flex-start; }
    .entry .tick { width: 1.6rem; height: 1.6rem; flex-shrink: 0; margin: .15rem 0 0; accent-color: var(--success); }
    .entry .pic { flex-shrink: 0; width: 88px; height: 88px; border-radius: var(--radius-sm); overflow: hidden;
      background: var(--primary-soft); display: block; }
    .entry .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .entry .body { flex: 1; min-width: 0; }
    .entry .what { font-weight: 700; }
    .entry .qty { font-weight: 400; color: var(--muted); }
    .entry .pn { display: inline-block; margin-top: .15rem; font-size: .95rem; }
    .entry .details { font-size: .88rem; margin-top: .2rem; white-space: pre-line; overflow-wrap: anywhere; }
    .entry .meta { font-size: .78rem; color: var(--muted); margin-top: .3rem; }
    .entry .meta a { color: var(--primary-hover); }
    .entry .drop { border: none; background: none; color: var(--muted); font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 0 .2rem; }
    .entry.bought { opacity: .55; }
    .entry.bought .what { text-decoration: line-through; }

    .done-bar { display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; }
    .empty { color: var(--muted); }
    .entry .acts { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .4rem; }
    .entry .acts .btn { padding: .3rem .65rem; font-size: .82rem; }
    .entry .acts .link { border: none; background: none; padding: 0; font-size: .8rem; color: var(--muted);
      text-decoration: underline; cursor: pointer; }
    .entry.ordered { border-style: dashed; }
    .entry .ref { overflow-wrap: anywhere; }
    .setup-link { margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem; font-size: .9rem; }
    .setup-link a { color: var(--primary-hover); font-weight: 600; }
    .here { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; margin: 0 0 .7rem; font-size: .95rem; }
    .here .btn { padding: .35rem .7rem; font-size: .85rem; }
    .here .quiet { color: var(--muted); font-size: .85rem; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <a class="back" href="/">← Home</a>
      <a class="brand" href="/">
        <img class="logo" src="/assets/rack.svg" alt="">
        <span class="name">rack</span>
      </a>
    </header>

    <h1>Shopping list</h1>
    <p class="subtitle">With a photo and part number on each line, so you come home with the right one. Add from any item with <em>Add to shopping list…</em>, or here.</p>

    <details class="add" id="add">
      <summary>+ Add something</summary>
      <form id="addForm">
        <input id="fWhat" type="text" placeholder="What (e.g. wall plugs)" required>
        <div class="pair">
          <input id="fStore" type="text" placeholder="Store (e.g. Leroy)" list="storeList" autocomplete="off">
          <input id="fQty" type="text" placeholder="How many">
        </div>
        <datalist id="storeList"></datalist>
        <div class="pair">
          <input id="fPn" type="text" placeholder="Part number / article no.">
          <input id="fBrand" type="text" placeholder="Brand" list="rack-brands" autocomplete="off">
        </div>
        <textarea id="fDetails" rows="2" placeholder="Size, colour, the one that fits…"></textarea>
        <div class="photo-line">
          <label class="btn" id="shoot">📷 Photo
            <input type="file" accept="image/*" capture="environment" id="photoInput" hidden>
          </label>
          <span id="photoState">No photo</span>
          <button type="button" class="drop" id="photoDrop" hidden title="Drop the photo">&times;</button>
        </div>
        <p class="read-hint" id="readHint" hidden></p>
        <button class="btn primary" type="submit" id="addBtn">Add to list</button>
      </form>
    </details>

    <p class="here" id="here" hidden></p>
    <div class="stores" id="stores" hidden></div>
    <p class="status" id="status"></p>
    <div id="list"></div>

    <p class="setup-link"><a href="/shops.html">Shops, where they are, and which brands they sell →</a></p>
  </div>

  <script>
    (function () {
      const ANYWHERE = '';            // the chip for lines with no store
      let entries = [];
      let shops = [];                 // what is said about each store: online, search address
      let photo = null;               // the one picture for the line being typed

      const $ = id => document.getElementById(id);
      const status = $('status');

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g,
          c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
      const key = s => (s || '').trim().toLowerCase();
      const shopOf = store => store ? shops.find(s => key(s.name) === key(store)) : undefined;
      const isOnline = store => !!(shopOf(store) || {}).online;
      // A line may come from several shops — a Logitech mouse from Komplett
      // or Amazon, whichever gets there first — and shows under each.
      const shopsOf = e => [e.store].concat(e.also_at || []).filter(Boolean);
      const soldAt = (e, store) => shopsOf(e).some(st => key(st) === key(store));
      // Still to get: not in hand, not on its way.
      const isOpen = e => !e.bought_at && !e.ordered_at;
      const isOrdered = e => !e.bought_at && !!e.ordered_at;

      // The store you are at is in the address, so a home-screen shortcut or a
      // reload in the aisle comes back to the same filter.
      function chosen() {
        const p = rackRoute.params();
        return p.has('store') ? p.get('store') : null;    // null: everything
      }

      async function load() {
        try {
          const res = await fetch('/shopping');
          if (!res.ok) throw new Error(res.statusText);
          entries = await res.json();
          status.textContent = '';
          draw();
        } catch (e) {
          status.className = 'status error';
          status.textContent = 'Could not load the list: ' + e.message;
        }
      }

      // Every store box offers every store the list knows — lines, brand rules
      // and saved spots alike — not only the ones with a line on the list now.
      // The chips stay the stores on the list: they filter it.
      function fillStores() {
        fetch('/shopping/stores').then(r => r.ok ? r.json() : []).catch(() => [])
          .then(names => {
            $('storeList').innerHTML = names.map(n => '<option value="' + esc(n) + '">').join('');
          });
      }

      function draw() {
        const stores = rackShopping.storesOf(entries);
        fillStores();
        drawChips(stores);

        const at = chosen();
        const open = entries.filter(isOpen);
        const ordered = entries.filter(isOrdered);
        const bought = entries.filter(e => e.bought_at);
        // At a store: that store's lines, then whatever has no store at all.
        const here = e => at === null || soldAt(e, at) || !e.store;

        const host = $('list');
        let html = '';
        const shown = open.filter(here);
        const coming = ordered.filter(here);
        if (!entries.length) {
          html = '<p class="empty">Nothing on the list.</p>';
        } else if (!shown.length) {
          html = '<p class="empty">Nothing left to ' + (at && isOnline(at) ? 'order' : 'get') + (at ? ' at ' + esc(at) : '') + '.</p>';
        } else {
          groups(shown, at).forEach(g => {
            html += '<div class="group-title">' + esc(g.title) + '</div>'
              + '<ul class="entries">' + g.items.map(entry).join('') + '</ul>';
          });
        }
        if (coming.length) {
          html += '<div class="group-title">On its way (' + coming.length + ')</div>'
            + '<ul class="entries">' + coming.map(entry).join('') + '</ul>';
        }
        const boughtHere = bought.filter(here);
        if (boughtHere.length) {
          html += '<div class="done-bar"><div class="group-title">Got it (' + boughtHere.length + ')</div>'
            + '<button type="button" class="btn" id="clear">Clear bought</button></div>'
            + '<ul class="entries">' + boughtHere.map(entry).join('') + '</ul>';
        }
        host.innerHTML = html;

        host.querySelectorAll('.tick').forEach(cb => cb.addEventListener('change', () => tick(cb.dataset.id, cb.checked)));
        host.querySelectorAll('.entry .unorder').forEach(b => b.addEventListener('click', () => unorder(b.dataset.id)));
        host.querySelectorAll('.entry .reorder').forEach(b => b.addEventListener('click', () => orderRef(b.dataset.id)));
        host.querySelectorAll('.entry .drop').forEach(b => b.addEventListener('click', () => drop(b.dataset.id, b)));
        const clear = $('clear');
        if (clear) clear.addEventListener('click', clearBought);
      }

      function drawChips(stores) {
        const host = $('stores');
        const open = entries.filter(isOpen);
        const count = name => open.filter(e => soldAt(e, name)).length;
        const anywhere = open.filter(e => !e.store).length;
        if (!stores.length) { host.hidden = true; return; }
        const at = chosen();
        const chip = (label, value, n) => '<button type="button" class="container-btn' +
          ((value === null ? at === null : at !== null && key(at) === key(value)) ? ' on' : '') +
          '" data-store="' + (value === null ? '' : esc(value)) + '" data-all="' + (value === null) + '">' +
          esc(label) + (n != null ? '<span class="n">' + n + '</span>' : '') + '</button>';
        host.innerHTML = chip('All', null, open.length)
          + stores.slice().sort((a, b) => a.localeCompare(b)).map(s => chip((isOnline(s) ? '🌐 ' : '') + s, s, count(s))).join('')
          + (anywhere ? chip('Anywhere', ANYWHERE, anywhere) : '');
        host.hidden = false;
        host.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
          autoPicked = false;                 // a tap is a decision; stop following the GPS
          rackRoute.go(b.dataset.all === 'true' ? '' : 'store=' + encodeURIComponent(b.dataset.store));
          draw();
          drawHere();
        }));
      }

      /**
       * By store, in name order, with the no-store lines last. A line for
       * several shops is grouped under all of them ("Komplett or Amazon.es"),
       * or under the one the list is filtered to.
       */
      function groups(list, at) {
        const by = new Map();
        list.forEach(e => {
          const names = at !== null && e.store && soldAt(e, at) ? [shopsOf(e).find(st => key(st) === key(at))] : shopsOf(e);
          const k = names.map(key).join('|');
          if (!by.has(k)) by.set(k, { title: names.join(' or ') || 'Anywhere', items: [] });
          by.get(k).items.push(e);
        });
        return [...by.entries()]
          .sort(([a], [b]) => (a === '') - (b === '') || a.localeCompare(b))
          .map(([, g]) => g);
      }

      function entry(e) {
        const pic = e.photo
          ? '<a class="pic" href="/shopping/photos/' + encodeURIComponent(e.photo) + '" target="_blank">' +
              '<img loading="lazy" alt="" src="/shopping/photos/' + encodeURIComponent(e.photo) + '?w=320"></a>'
          : '';
        const where = e.container ? esc(e.container) + (e.slot ? '/' + esc(e.slot) : '') : '';
        const href = e.container ? rackRoute.slotHref(e.container, e.slot) : '';
        // Once it is in hand, the drawer it came from is where it goes: the
        // step where a parcel gets opened and the index is never told.
        const from = !e.container ? ''
          : e.bought_at ? '' : 'Same as in <a href="' + href + '">' + where + '</a>';
        const added = e.added_at ? 'added ' + new Date(e.added_at).toLocaleDateString() : '';
        const sent = e.ordered_at ? 'ordered ' + new Date(e.ordered_at).toLocaleDateString() : '';
        const ref = e.order_ref
          ? (/^https?:\/\//i.test(e.order_ref)
              ? '<a class="ref" href="' + esc(e.order_ref) + '" target="_blank" rel="noopener noreferrer">track</a>'
              : '<span class="ref">order ' + esc(e.order_ref) + '</span>')
          : '';
        const at = chosen();
        // Filtered to one of its shops, that is the one in play; otherwise all of them.
        const inPlay = at !== null && soldAt(e, at) ? shopsOf(e).filter(st => key(st) === key(at)) : shopsOf(e);
        const others = at !== null && soldAt(e, at) ? shopsOf(e).filter(st => key(st) !== key(at)) : [];
        const also = others.length ? 'also at ' + others.map(esc).join(', ') : '';
        const acts = [];
        inPlay.map(shopOf).filter(shop => isOpen(e) && shop && shop.search_url).forEach(shop => {
          // The shop's own search, never a product page rack made up. By name
          // first: a name always says what the thing is, where a part number
          // read off it may be a certification ID or a batch code that no shop
          // indexes — "DZLMRCJ134" is a Logitech mouse's FCC ID and found
          // nothing. The part number is the second button, for the shops
          // (Farnell) where it is exactly the right search.
          const search = q => esc(shop.search_url.split('{q}').join(encodeURIComponent(q)));
          acts.push('<a class="btn" target="_blank" rel="noopener noreferrer" href="' + search(e.what)
            + '">🔎 Search ' + esc(shop.name) + '</a>');
          if (e.part_number && key(e.part_number) !== key(e.what)) {
            acts.push('<a class="btn" target="_blank" rel="noopener noreferrer" href="' + search(e.part_number)
              + '">🔎 ' + esc(e.part_number) + (inPlay.length > 1 ? ' at ' + esc(shop.name) : '') + '</a>');
          }
        });
        if (isOrdered(e)) {
          acts.push('<button type="button" class="link reorder" data-id="' + esc(e.id) + '">' + (e.order_ref ? 'change order no.' : 'add order no.') + '</button>');
          acts.push('<button type="button" class="link unorder" data-id="' + esc(e.id) + '">not ordered after all</button>');
        }
        if (e.bought_at && e.container) {
          acts.push('<a class="btn primary" href="' + href + '">Put it in ' + where + '</a>');
        }
        const online = orderFrom(e) !== null;
        const tickTitle = e.bought_at ? 'Got it' : isOrdered(e) ? 'Arrived' : online ? 'Ordered' : 'Got it';
        return '<li class="entry' + (e.bought_at ? ' bought' : '') + (isOrdered(e) ? ' ordered' : '') + '">' +
          '<input type="checkbox" class="tick" data-id="' + esc(e.id) + '"' + (e.bought_at ? ' checked' : '') + ' title="' + tickTitle + '" aria-label="' + tickTitle + '">' +
          pic +
          '<div class="body">' +
            '<div class="what">' + esc(e.what) + (e.qty ? ' <span class="qty">× ' + esc(e.qty) + '</span>' : '') + '</div>' +
            (e.part_number ? '<div class="pn">' + esc(e.part_number) + '</div>' : '') +
            (e.details ? '<div class="details">' + esc(e.details) + '</div>' : '') +
            '<div class="meta">' + [from, also, sent || added, ref].filter(Boolean).join(' · ') + '</div>' +
            (acts.length ? '<div class="acts">' + acts.join('') + '</div>' : '') +
          '</div>' +
          '<button type="button" class="drop" data-id="' + esc(e.id) + '" title="Remove from the list">&times;</button>' +
        '</li>';
      }

      // One box, three meanings. A line for an online shop is ticked once when
      // it is ordered and again when it arrives; unticking an arrived line puts
      // it back on its way, since it was ordered all the same.
      /**
       * Which online shop ticking this line means it was ordered from, or
       * null when ticking means it is in hand. Filtered to one of its shops,
       * that shop decides. Otherwise it is an order only when every shop it
       * may come from is online — one of them having a door means it may be
       * picked up — and the first of them stands for the rest until asked.
       */
      function orderFrom(e) {
        const at = chosen();
        if (at !== null && soldAt(e, at)) return isOnline(at) ? shopsOf(e).find(st => key(st) === key(at)) : null;
        const shops = shopsOf(e);
        return shops.length && shops.every(isOnline) ? shops[0] : null;
      }

      async function tick(id, checked) {
        const e = entries.find(x => x.id === id);
        let from = e && checked && isOpen(e) ? orderFrom(e) : null;
        if (from) {
          const shops = shopsOf(e);
          // Several online shops and nothing filtered: ask which, since the
          // line narrows to it — once it is coming from Amazon, Komplett is not.
          const pick = shops.length > 1 && !(chosen() !== null && soldAt(e, chosen()));
          const r = await rackDialog.ask({
            title: 'Ordered',
            message: pick ? 'Which shop is “' + e.what + '” coming from?' : '“' + e.what + '” from ' + from + '.',
            choices: pick ? shops : null,
            choice: from,
            input: { label: 'Order number or tracking link (optional)', placeholder: 'e.g. 302-1234567' },
            ok: 'Ordered'
          });
          if (r === null) { draw(); return; }          // cancelled: leave it as it was
          if (pick) from = r.choice;
          return patch(id, { ordered: true, order_ref: r.value.trim() || null, ordered_from: from });
        }
        await patch(id, { bought: checked });
      }

      async function orderRef(id) {
        const e = entries.find(x => x.id === id);
        const ref = await rackDialog.prompt({
          title: e ? e.what : 'Order', label: 'Order number or tracking link',
          value: (e && e.order_ref) || '', ok: 'Save'
        });
        if (ref === null) return;
        await patch(id, { ordered: true, order_ref: ref.trim() || null });
      }

      async function unorder(id) {
        await patch(id, { ordered: false });
      }

      function patch(id, body) {
        return change(fetch('/shopping/' + encodeURIComponent(id), {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }));
      }

      async function drop(id, btn) {
        const e = entries.find(x => x.id === id);
        // Something already got goes on one click; one still wanted asks twice.
        if (e && !e.bought_at && !rackDialog.really(btn)) return;
        await change(fetch('/shopping/' + encodeURIComponent(id), { method: 'DELETE' }));
      }

      async function clearBought() {
        await change(fetch('/shopping?bought=true', { method: 'DELETE' }));
      }

      async function change(request) {
        try {
          const res = await request;
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
        } catch (e) {
          status.className = 'status error';
          status.textContent = 'Did not save: ' + e.message;
        }
        await load();
      }

      // One picture per line: the last one taken is the one kept.
      rackCamera.claim($('shoot'), $('photoInput'), {
        title: 'What to buy',
        each: files => { photo = files[files.length - 1]; showPhoto(); readPhoto(photo); }
      });
      $('photoDrop').addEventListener('click', () => { photo = null; reading = null; showPhoto(); $('readHint').hidden = true; });
      function showPhoto() {
        $('photoState').textContent = photo ? 'Photo attached' : 'No photo';
        $('photoDrop').hidden = !photo;
      }

      // The photo is read as soon as it is taken, the way a drawer's is, and
      // fills in whatever boxes are still empty — never one already typed in.
      // Nothing is stored until Add: the reading is a suggestion to check.
      let reading = null;                    // the photo being read; a newer one makes an older answer stale
      async function readPhoto(file) {
        reading = file;
        const hint = $('readHint');
        $('photoState').textContent = 'Reading the photo…';
        hint.hidden = true;
        const form = new FormData();
        form.append('photo', file, file.name || 'photo.jpg');
        if (file.seen) form.append('seen', file.seen);
        try {
          const res = await fetch('/shopping/read', { method: 'POST', body: form });
          if (reading !== file) return;
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
          const r = await res.json();
          if (reading !== file) return;
          const fill = (id, v) => { if (v && !$(id).value.trim()) $(id).value = v; };
          fill('fWhat', r.what);
          fill('fPn', r.part_number);
          fill('fBrand', r.brand);
          fill('fDetails', r.details);
          $('photoState').textContent = 'Photo read';
          const lines = [];
          if (r.stores && r.stores.length && !$('fStore').value.trim()) {
            lines.push('Goes on the list for <b>' + r.stores.map(esc).join('</b> and <b>') + '</b> — ' + esc(r.because) + '.');
          }
          if (r.others) lines.push('The photo showed ' + (r.others + 1) + ' things; this is the clearest. Check it is the one you meant.');
          lines.push('Read by the camera — check before adding.');
          hint.innerHTML = lines.join(' ');
          hint.hidden = false;
        } catch (e) {
          if (reading !== file) return;
          $('photoState').textContent = 'Photo attached';
          hint.textContent = 'Could not read it (' + e.message + ') — fill it in by hand.';
          hint.hidden = false;
        } finally {
          if (window.rackUsage) rackUsage.refresh();
        }
      }

      // Typing a line while filtered to a store means it is for that store.
      $('add').addEventListener('toggle', () => {
        const at = chosen();
        if ($('add').open && at && !$('fStore').value) $('fStore').value = at;
      });

      $('addForm').addEventListener('submit', async ev => {
        ev.preventDefault();
        const btn = $('addBtn');
        const form = new FormData();
        form.append('what', $('fWhat').value);
        form.append('store', $('fStore').value);
        form.append('qty', $('fQty').value);
        form.append('part_number', $('fPn').value);
        form.append('brand', $('fBrand').value);
        form.append('details', $('fDetails').value);
        if (photo) {
          form.append('photo', photo, photo.name || 'photo.jpg');
          if (photo.seen) form.append('seen', photo.seen);
        }
        btn.disabled = true;
        status.className = 'status';
        status.textContent = 'Adding…';
        try {
          const res = await fetch('/shopping', { method: 'POST', body: form });
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
          ['fWhat', 'fQty', 'fPn', 'fBrand', 'fDetails'].forEach(id => { $(id).value = ''; });
          photo = null; reading = null; showPhoto();
          $('readHint').hidden = true;
          rackBrands.refresh();
          status.textContent = '';
          await load();
          $('fWhat').focus();
        } catch (e) {
          status.className = 'status error';
          status.textContent = 'Could not add: ' + e.message;
        } finally {
          btn.disabled = false;
        }
      });

      async function loadShops(request) {
        try {
          const res = await (request || fetch('/shopping/shops'));
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
          shops = await res.json();
        } catch (e) {
          status.className = 'status error';
          status.textContent = 'Shops: ' + e.message;
          return false;
        }
        draw();
        drawHere();
        return true;
      }

      // Saying which shops are online, and how to search them, is on the
      // Shops page under Setup; the list only reads it.
      loadShops();


      // ---- Where am I? -------------------------------------------------
      // A shop spot counts within 150 m, plus the fix's own uncertainty up to
      // another 100: a big store is a hundred metres across, and indoors a
      // phone is rarely sure to better than a few tens.
      const NEAR = 150;
      let places = [];
      let fix = null;                 // the phone's last position, kept on the phone
      let near = null;                // {store, metres} when inside a saved shop
      let autoPicked = false;         // the filter was set by location, not a tap

      function metres(a, b) {
        const R = 6371000, rad = Math.PI / 180;
        const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
        const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(h));
      }

      function position() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) return reject(new Error('this browser cannot tell where it is'));
          navigator.geolocation.getCurrentPosition(
            p => resolve({ lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy }),
            e => reject(new Error(e.code === 1 ? 'location permission was refused' : 'no position (' + e.message + ')')),
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
        });
      }

      async function loadPlaces(request) {
        try {
          const res = await (request || fetch('/shopping/places'));
          if (!res.ok) throw new Error((await res.json().catch(() => ({}))).message || res.statusText);
          const body = await res.json();
          // Saving answers with the one spot saved, forgetting with the whole
          // list; either way the list drawn is the list the server now holds.
          if (Array.isArray(body)) {
            places = body;
          } else {
            const all = await fetch('/shopping/places');
            if (!all.ok) throw new Error(all.statusText);
            places = await all.json();
          }
          if (request) fillStores();
        } catch (e) {
          status.className = 'status error';
          status.textContent = 'Shop spots: ' + e.message;
        }
      }


      /** Only asks the phone when there is something to compare against. */
      async function locate() {
        if (!places.length) return;
        try {
          fix = await position();
        } catch (e) {
          fix = null;
        }
        decide();
      }

      function decide() {
        near = null;
        if (fix) {
          const radius = NEAR + Math.min(fix.accuracy || 0, 100);
          places.forEach(p => {
            const m = metres(fix, p);
            if (m <= radius && (!near || m < near.metres)) near = { store: p.store, metres: m };
          });
        }
        // Follows the GPS only while nobody has chosen otherwise: an address
        // with no store, or a store the location put there itself.
        const at = chosen();
        if (near && (at === null || autoPicked) && (at === null || key(at) !== key(near.store))) {
          autoPicked = true;
          rackRoute.go('store=' + encodeURIComponent(near.store), { replace: true });
          draw();
        }
        drawHere();
      }

      function drawHere() {
        const host = $('here');
        const at = chosen();
        if (at && isOnline(at)) {
          host.innerHTML = '🌐 <b>' + esc(at) + '</b> is online — tick a line when you order it, and again when it arrives.';
        } else if (near && at !== null && key(at) === key(near.store)) {
          host.innerHTML = '📍 You\'re at <b>' + esc(near.store) + '</b>';
        } else if (fix && at) {
          // Filtered to a shop the phone is not near any saved spot of: the
          // moment to teach it, if this is where you are.
          host.innerHTML = '<button type="button" class="btn" id="hereSave">📍 I\'m at ' + esc(at) + ' — save this spot</button>';
          $('hereSave').addEventListener('click', () => savePlace(at));
        } else if (!places.length && at) {
          host.innerHTML = '<button type="button" class="btn" id="hereSave">📍 I\'m at ' + esc(at) + ' — save this spot</button>' +
            '<span class="quiet">so the list opens on ' + esc(at) + ' next time</span>';
          $('hereSave').addEventListener('click', () => savePlace(at));
        } else {
          host.innerHTML = '';
        }
        host.hidden = !host.innerHTML;
      }

      async function savePlace(store) {
        status.className = 'status';
        status.textContent = 'Finding where you are…';
        try {
          const p = await position();
          await loadPlaces(fetch('/shopping/places', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ store, lat: p.lat, lon: p.lon, accuracy: p.accuracy })
          }));
          fix = p;
          status.textContent = 'Saved: this is ' + store + (p.accuracy ? ' (to within ' + Math.round(p.accuracy) + ' m)' : '') + '.';
          decide();
        } catch (e) {
          status.className = 'status error';
          status.textContent = 'Could not save the spot: ' + e.message;
        }
      }


      loadPlaces().then(locate);


      rackRoute.onChange(() => { autoPicked = false; draw(); drawHere(); });
      load();
      // Ticked off on another phone in the same shop.
      document.addEventListener('visibilitychange', () => { if (!document.hidden) { load(); locate(); } });
    })();
  </script>
  <script src="/assets/usage.js" defer></script>
</body>
</html>
