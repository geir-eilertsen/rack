<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — print labels</title>
  <link rel="icon" type="image/svg+xml" href="/assets/rack.svg">
  <link rel="apple-touch-icon" href="/assets/rack.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d97747">
  <link rel="stylesheet" href="/assets/rack.css">
  <style>
    .card-detail { padding: 1.1rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); margin-top: 1rem; }
    .counts { font-size: .95rem; margin-bottom: .5rem; }
    .num { font-weight: 700; color: var(--primary-hover); font-family: var(--font-mono); }
    .advanced { margin-top: .75rem; border-top: 1px solid var(--border); padding-top: .75rem; }
    .advanced summary { cursor: pointer; font-size: .8rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
    .advanced summary:hover { color: var(--text); }
    .toggle-line { display: block; margin: .5rem 0; font-size: .9rem; color: var(--text); }
    .toggle-line input { margin-right: .4rem; }
    .print-actions { display: flex; gap: .5rem; margin-top: .85rem; }
    .print-actions .btn { flex: 1; }
    .note { color: var(--muted); font-size: .8rem; margin-top: .75rem; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <a class="back" href="/">← Home</a>
      <a class="brand" href="/">
        <img class="logo" src="/assets/rack.svg" alt="">
        <span class="name">rack</span>
      </a>
    </header>

    <h1>Print labels</h1>

    <h2>Container</h2>
    <div class="containers" id="containers"></div>

    <div class="card-detail" id="detail" hidden>
      <div class="counts" id="counts"></div>
      <div class="counts" id="offsetInfo"></div>

      <div class="print-actions">
        <button class="btn" id="preview">Preview</button>
        <button class="btn primary" id="print">Print &amp; mark as done</button>
      </div>

      <details class="advanced">
        <summary>Advanced options</summary>
        <label class="toggle-line"><input type="checkbox" id="includeAll"> Include already-printed slots</label>
        <label class="toggle-line"><input type="checkbox" id="freshSheet"> Fresh sheet (start at position 1)</label>
      </details>

      <div class="status" id="status"></div>
      <div class="note">Preview generates a PDF without marking slots. Print &amp; mark saves a copy under <code>data/&lt;container&gt;/labels/</code> and offsets past positions already used on the current sheet.</div>
    </div>
  </div>

  <script>
    const containersEl = document.getElementById('containers');
    const detail = document.getElementById('detail');
    const counts = document.getElementById('counts');
    const offsetInfo = document.getElementById('offsetInfo');
    const includeAll = document.getElementById('includeAll');
    const freshSheet = document.getElementById('freshSheet');
    const preview = document.getElementById('preview');
    const print = document.getElementById('print');
    const status = document.getElementById('status');

    let selected = null;

    init();

    async function init() {
      try {
        const res = await fetch('/c');
        const containers = await res.json();
        renderContainers(containers);
        if (containers.length === 1) selectContainer(containers[0]);
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Failed to load containers: ' + e.message;
      }
    }

    function renderContainers(list) {
      containersEl.innerHTML = '';
      list.forEach(c => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'container-btn';
        btn.textContent = c.name || c.id;
        btn.addEventListener('click', () => selectContainer(c));
        containersEl.appendChild(btn);
      });
    }

    async function selectContainer(c) {
      selected = c;
      containersEl.querySelectorAll('.container-btn').forEach(el => el.classList.toggle('selected', el.textContent === (c.name || c.id)));
      detail.hidden = false;
      status.className = 'status';
      status.textContent = '';
      await refreshCounts();
    }

    async function refreshCounts() {
      const res = await fetch('/labels/' + selected.id + '/status');
      const s = await res.json();
      counts.innerHTML = '<span class="num">' + s.printed + '</span> printed · <span class="num">' + s.unprinted + '</span> pending · <span class="num">' + s.total + '</span> total';
      if (s.next_offset > 0) {
        offsetInfo.textContent = 'Next sheet starts at position ' + (s.next_offset + 1) + ' — feeds around the ' + s.next_offset + ' labels already peeled.';
      } else {
        offsetInfo.textContent = 'Next sheet starts fresh.';
      }
      const pending = s.unprinted > 0 || includeAll.checked;
      preview.disabled = !pending && !includeAll.checked;
      print.disabled = !pending && !includeAll.checked;
    }

    function queryParams() {
      const params = new URLSearchParams();
      params.set('scope', includeAll.checked ? 'all' : 'unprinted');
      if (freshSheet.checked) params.set('offset', '0');
      return params.toString();
    }

    preview.addEventListener('click', () => {
      if (!selected) return;
      window.open('/labels/' + selected.id + '?' + queryParams(), '_blank');
    });

    print.addEventListener('click', async () => {
      if (!selected) return;
      status.className = 'status';
      status.textContent = 'Generating...';
      try {
        const res = await fetch('/labels/' + selected.id + '?' + queryParams(), { method: 'POST' });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const blob = await res.blob();
        window.open(URL.createObjectURL(blob), '_blank');
        status.className = 'status ok';
        status.textContent = 'Marked as printed and saved.';
        await refreshCounts();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Failed: ' + e.message;
      }
    });

    includeAll.addEventListener('change', refreshCounts);
  </script>
</body>
</html>
