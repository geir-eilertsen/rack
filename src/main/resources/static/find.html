<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — find</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 640px; color: #222; }
    .back { color: #666; text-decoration: none; font-size: .85rem; }
    .back:hover { color: #222; }
    h1 { font-size: 1.2rem; margin: .25rem 0 1rem; }
    .search { display: flex; gap: .3rem; margin-bottom: 1rem; }
    .search input { flex: 1; padding: .6rem .75rem; font: inherit; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    .status { color: #666; font-size: .9rem; margin-bottom: .5rem; }
    .status.error { color: #b00020; }
    .hits { list-style: none; padding: 0; margin: 0; }
    .hit { padding: .75rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: .5rem; }
    .hit .loc { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .35rem; }
    .hit .loc a { color: #333; font-weight: 600; text-decoration: none; font-family: ui-monospace, SFMono-Regular, monospace; }
    .hit .loc a:hover { text-decoration: underline; }
    .hit .verified { font-size: .75rem; color: #666; }
    .hit .verified.stale { color: #b58900; }
    .hit .verified.never { color: #999; }
    .hit h3 { margin: 0 0 .2rem; font-size: .95rem; }
    .pn { font-family: ui-monospace, SFMono-Regular, monospace; color: #444; font-size: .85rem; }
    .meta { font-size: .8rem; color: #666; margin-top: .2rem; }
    .tags { margin-top: .2rem; }
    .tag { display: inline-block; background: #eef; padding: .1rem .5rem; border-radius: 999px; margin: .1rem .1rem 0 0; font-size: .7rem; }
  </style>
</head>
<body>
  <a class="back" href="/">&larr; rack</a>
  <h1>find</h1>

  <div class="search">
    <input id="q" type="search" placeholder="e.g. BC547, transistor, TO-220, red LED" autocomplete="off" autofocus>
  </div>
  <div class="status" id="status">Type to search.</div>
  <ul class="hits" id="hits"></ul>

  <script>
    const q = document.getElementById('q');
    const status = document.getElementById('status');
    const hits = document.getElementById('hits');

    let controller = null;
    let debounce = null;

    q.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(runSearch, 250);
    });

    async function runSearch() {
      const query = q.value.trim();
      if (!query) {
        status.className = 'status';
        status.textContent = 'Type to search.';
        hits.innerHTML = '';
        return;
      }
      if (controller) controller.abort();
      controller = new AbortController();
      status.className = 'status';
      status.textContent = 'Searching...';
      try {
        const res = await fetch('/search?q=' + encodeURIComponent(query), { signal: controller.signal });
        if (!res.ok) throw new Error(await res.text() || ('HTTP ' + res.status));
        const results = await res.json();
        renderHits(results, query);
      } catch (e) {
        if (e.name === 'AbortError') return;
        status.className = 'status error';
        status.textContent = 'Search failed: ' + e.message;
      }
    }

    function renderHits(results, query) {
      if (!results.length) {
        status.className = 'status';
        status.textContent = 'No matches for "' + esc(query) + '".';
        hits.innerHTML = '';
        return;
      }
      status.className = 'status';
      status.textContent = results.length + ' match' + (results.length === 1 ? '' : 'es') + ' for "' + esc(query) + '".';
      hits.innerHTML = results.map(renderHit).join('');
    }

    function renderHit(h) {
      const it = h.item || {};
      const tags = (it.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
      const conf = it.confidence != null ? Math.round(it.confidence * 100) + '%' : '?';
      const qty = it.qty_estimate != null ? it.qty_estimate : '?';
      const location = h.container + ' &middot; ' + h.slot;
      const putUrl = '/put.html?c=' + encodeURIComponent(h.container) + '&s=' + encodeURIComponent(h.slot);
      return '<li class="hit">' +
        '<div class="loc"><a href="' + putUrl + '">' + esc(location) + '</a>' + verifiedBadge(h.last_verified) + '</div>' +
        '<h3>' + esc(it.description || '(unknown)') + '</h3>' +
        (it.part_number ? '<div class="pn">' + esc(it.part_number) + '</div>' : '') +
        '<div class="meta">' + esc(it.category || '') + ' &middot; qty ' + qty + ' &middot; conf ' + conf + '</div>' +
        (tags ? '<div class="tags">' + tags + '</div>' : '') +
      '</li>';
    }

    function verifiedBadge(iso) {
      if (!iso) return '<span class="verified never">never verified</span>';
      const d = new Date(iso);
      const days = Math.floor((Date.now() - d.getTime()) / 86400000);
      const label = days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
      const stale = days > 180;
      return '<span class="verified' + (stale ? ' stale' : '') + '">verified ' + label + '</span>';
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
</body>
</html>
