<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — find an item</title>
  <link rel="icon" type="image/svg+xml" href="/assets/rack.svg">
  <link rel="apple-touch-icon" href="/assets/rack.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d97747">
  <link rel="stylesheet" href="/assets/rack.css">
  <script src="/assets/photos.js"></script>
  <style>
    .search { margin-bottom: 1rem; display: flex; gap: .4rem; }
    .search input { flex: 1; min-width: 0; font-size: 1.05rem; padding: .8rem 1rem; }
    .search .shoot { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0 .9rem; }
    /* The things you looked for before, for the trip you make twice. */
    .recent { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0 0 1rem; }
    .recent .again { padding: .35rem .7rem; border: 1px solid var(--border); border-radius: 999px;
      background: var(--card); color: var(--primary-hover); font-size: .82rem; font-family: inherit;
      cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .recent .again:hover { background: var(--primary-soft); border-color: var(--primary); }
    .hits { list-style: none; padding: 0; margin: 0; }
    .group { padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: .75rem; background: var(--card); box-shadow: var(--shadow); }
    .group .loc { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .35rem; }
    .group .loc a { color: var(--primary-hover); font-weight: 700; text-decoration: none; font-family: var(--font-mono); font-size: 1.05rem; }
    .group .loc a:hover { text-decoration: underline; }
    .group ul.items { list-style: none; padding: 0; margin: .6rem 0 0; }
    .group ul.items > li { padding: .65rem .75rem; border-top: 1px solid var(--border); cursor: pointer; transition: background .12s ease; border-radius: var(--radius-xs); }
    .group ul.items > li:first-child { border-top: none; }
    .group ul.items > li:hover { background: var(--primary-soft); }
    .group ul.items > li.editing { cursor: default; background: var(--card); }
    .row { display: flex; align-items: center; gap: .5rem; }
    .thumb { flex: 0 0 auto; width: 48px; height: 48px; object-fit: cover; border-radius: var(--radius-xs); border: 1px solid var(--border); }
    .thumb-placeholder { flex: 0 0 auto; width: 48px; height: 48px; border-radius: var(--radius-xs); background: var(--primary-soft); display: flex; align-items: center; justify-content: center; color: var(--primary); }
    .body { flex: 1; min-width: 0; }
    .desc { font-weight: 500; font-size: .95rem; }
    .detail { font-size: .82rem; color: var(--muted); margin-top: .15rem; font-weight: 400; }
    .qty { font-family: var(--font-mono); font-weight: 700; color: var(--primary-hover); font-size: .9rem; }
    /* Taking a couple of batteries is the commonest errand there is, so it is
       two taps on the result itself rather than a trip through the edit form. */
    .take { flex: 0 0 auto; display: flex; align-items: center; gap: .3rem; }
    .take .step { width: 32px; height: 32px; padding: 0; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border-strong); border-radius: 50%; background: var(--card); color: var(--primary-hover);
      font-size: 1.1rem; line-height: 1; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .take .step:hover:not(:disabled) { background: var(--primary-soft); border-color: var(--primary); }
    .take .step:disabled { opacity: .3; cursor: default; }
    .take .qty { min-width: 2.4em; text-align: center; }
    .editing .take { display: none; }
    .pn-line { margin-top: .2rem; }
    .tags-line { margin-top: .3rem; }
    .editing .row, .editing .pn-line, .editing .tags-line { display: none; }
    .edit-form { display: none; flex-direction: column; gap: .35rem; }
    .editing .edit-form { display: flex; }
    .edit-form label { font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: .35rem; }
    .edit-actions { display: flex; gap: .4rem; margin-top: .5rem; align-items: center; }
    .edit-actions .btn { flex: 1; }
    .edit-actions .remove { flex: 0 0 auto; background: transparent; border: none; color: var(--error); font-size: .85rem; cursor: pointer; padding: .3rem .5rem; text-decoration: underline; }
    .edit-actions .remove:hover { color: #7a2a20; }
    /* Every frame of the slot, in the expanded item. A part is often shot from
       two angles and its label from a third; only one is recorded as the frame
       it was read from, and the rest are just as much a picture of it. */
    .shots { margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--border); }
    .shots h4 { margin: 0 0 .45rem; font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .strip { display: flex; gap: .45rem; overflow-x: auto; padding-bottom: .2rem; }
    .strip .frame { position: relative; flex: 0 0 auto; line-height: 0; }
    .strip img { width: 84px; height: 84px; object-fit: cover; display: block; border: 1px solid var(--border); border-radius: var(--radius-xs); }
    .strip .frame.source img { border-color: var(--primary); border-width: 2px; }
    .strip .badge { position: absolute; left: 0; right: 0; bottom: 0; padding: .1rem 0; text-align: center;
      background: var(--primary); color: #fff; font-size: .6rem; line-height: 1.4; letter-spacing: .03em;
      border-radius: 0 0 var(--radius-xs) var(--radius-xs); }
    /* Same manual merge as the slot page. The targets cannot come from the
       search results — a group holds only this slot's matching rows, and you
       may well be merging into one that did not match. */
    .merge-panel { margin-top: .6rem; }
    .merge-panel summary { cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--primary-hover); padding: .3rem 0; }
    .merge-body { padding: .4rem 0 .2rem; }
    .merge-hint { margin: 0 0 .5rem; font-size: .8rem; color: var(--muted); }
    .merge-targets .merge-into { margin-bottom: .35rem; text-align: left; width: 100%; }
    .ai { margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--border); }
    .ai h4 { margin: 0 0 .4rem; font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .ai-input { display: flex; gap: .3rem; }
    .ai-input input { flex: 1; }
    .ai-input .ask-btn { flex: 0 0 auto; padding: .55rem .9rem; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <a class="back" href="/">← Home</a>
      <a class="brand" href="/">
        <img class="logo" src="/assets/rack.svg" alt="">
        <span class="name">rack</span>
      </a>
    </header>

    <h1>Find an item</h1>

    <div class="search">
      <input id="q" type="search" placeholder="e.g. transistor, TO-220, red LED" autocomplete="off"
             enterkeyhint="search" autofocus>
      <!-- Results come as you type; this says you meant it, and is what gets remembered. -->
      <button class="btn primary shoot" id="go" type="button" title="Search" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
      </button>
      <!-- For the part you are holding and cannot name. -->
      <button class="btn shoot" id="shoot" type="button" title="Search by photo" aria-label="Search by photo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <input type="file" accept="image/*" capture="environment" multiple id="photo" hidden>
    </div>
    <div class="recent" id="recent" hidden></div>
    <div class="status" id="status">Type to search.</div>
    <ul class="hits" id="hits"></ul>
  </div>

  <script>
    const q = document.getElementById('q');
    const status = document.getElementById('status');
    const hits = document.getElementById('hits');
    const shoot = document.getElementById('shoot');
    const photo = document.getElementById('photo');
    const recentEl = document.getElementById('recent');
    const go = document.getElementById('go');

    let controller = null;
    let smartController = null;
    let debounce = null;
    let smartDebounce = null;
    let containers = [];
    fetch('/c')
      .then(r => r.ok ? r.json() : [])
      .then(list => { containers = list; relabelContainers(); })
      .catch(() => {});

    // If results landed before /c did, the cards fell back to the key. Relabel
    // them in place rather than re-rendering, which would reset a take in flight.
    function relabelContainers() {
      hits.querySelectorAll('.group .loc a').forEach(a => {
        const params = new URLSearchParams((a.getAttribute('href') || '').split('?')[1] || '');
        const c = params.get('c');
        if (c) a.textContent = containerName(c) + ' · ' + params.get('s');
      });
    }

    // The same drawers get hunted over and over — batteries, heat shrink, that
    // one connector — so the second trip is a tap. Only shown with the box
    // empty, where they are an offer rather than something in the way.
    loadRecent();

    async function loadRecent() {
      try {
        const res = await fetch('/searches');
        if (res.ok) renderRecent(await res.json());
      } catch (e) { /* the search box works without them */ }
    }

    function renderRecent(queries) {
      recentEl.innerHTML = (queries || []).map(query =>
        '<button type="button" class="again">' + esc(query) + '</button>').join('');
      recentEl.querySelectorAll('.again').forEach(b => b.addEventListener('click', () => {
        q.value = b.textContent;
        submit();                                  // picking one is submitting it
      }));
      showRecent();
    }

    function showRecent() {
      recentEl.hidden = !recentEl.children.length || !!q.value.trim();
    }

    // Typing searches; submitting says you meant it. Only what you submit is
    // remembered — a pause between keystrokes was never evidence of intent.
    go.addEventListener('click', submit);
    q.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); submit(); }
    });

    function submit() {
      const query = q.value.trim();
      if (!query) { q.focus(); return; }
      clearTimeout(debounce);
      clearTimeout(smartDebounce);
      q.blur();                                  // let the results have the screen
      runSearch();
      remember(query);
    }

    async function remember(query) {
      try {
        const res = await fetch('/searches', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
        if (res.ok) renderRecent(await res.json());
      } catch (e) { /* the search still ran */ }
    }

    q.addEventListener('input', () => {
      showRecent();
      clearTimeout(debounce);
      clearTimeout(smartDebounce);
      debounce = setTimeout(runSearch, 250);
    });

    // Two passes. The first is pure keyword matching — no model call, so it can
    // land while you are still typing. Once typing settles the second asks the
    // server to widen the query, which it only does when the first came up short
    // (searching "isolating tape" and getting the electrical tape). Results are
    // already on screen by then; the widened set replaces them if it found more.
    async function runSearch() {
      const query = q.value.trim();
      if (!query) {
        status.className = 'status';
        status.textContent = 'Type to search.';
        hits.innerHTML = '';
        return;
      }
      if (controller) controller.abort();
      controller = new AbortController();
      status.className = 'status';
      status.textContent = 'Searching...';
      try {
        const res = await fetch('/search?q=' + encodeURIComponent(query), { signal: controller.signal });
        if (!res.ok) throw new Error(await res.text() || ('HTTP ' + res.status));
        var result = await res.json();
        renderResult(result);
      } catch (e) {
        if (e.name === 'AbortError') return;
        status.className = 'status error';
        status.textContent = 'Search failed: ' + e.message;
        return;
      }
      // Every word has to match, so an unfamiliar wording finds nothing here.
      // Say that the widening is coming rather than flashing "No matches" and
      // then quietly contradicting it a second later.
      const widening = !(result.hits || []).length;
      if (widening) {
        status.className = 'status';
        status.textContent = 'No exact match — looking for related items…';
      }
      clearTimeout(smartDebounce);
      smartDebounce = setTimeout(() => runSmartSearch(query, widening), 400);
    }

    async function runSmartSearch(query, widening) {
      if (smartController) smartController.abort();
      smartController = new AbortController();
      try {
        const res = await fetch('/search?q=' + encodeURIComponent(query) + '&smart=true', { signal: smartController.signal });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const result = await res.json();
        if (q.value.trim() !== query) return;      // typing moved on
        // Nothing to show yet when the literal pass came up empty, so render
        // whatever the widened pass found — including that it found nothing.
        if (widening || (result.expanded_terms && result.expanded_terms.length)) renderResult(result);
        if (window.rackUsage) rackUsage.refresh();
      } catch (e) {
        if (e.name === 'AbortError') return;
        if (widening && q.value.trim() === query) renderHits([], query, []);
      }
    }

    function renderResult(result) {
      renderHits(result.hits || [], result.query, result.expanded_terms || []);
    }

    // Taking stock from the result row. Each tap moves the number on screen at
    // once and the save follows a beat later, so taking three is three taps and
    // one write rather than three round trips racing each other.
    const stock = new Map();
    const SAVE_AFTER = 500;

    function stockKey(container, slot, index) { return container + '/' + slot + '/' + index; }

    // Containers are keyed by a short id ("rack") but named by their owner
    // ("Skuffereol"). The key belongs in URLs; the name belongs on screen.

    // What a container's owner calls one of its subdivisions, and whether it has
    // any: a container with a single slot is itself the place.
    function containerOf(id) { return containers.find(c => c.id === id); }

    // Where a thing is. A container with one storage space is the whole answer;
    // appending its lone slot id would read as "Plastboks 1 · 1".
    function placeName(containerId, slot) {
      const c = containerOf(containerId);
      return isDivided(c) ? containerName(containerId) + ' · ' + slot : containerName(containerId);
    }
    function slotWord(c) { return (c && c.slot_label) || 'slot'; }
    function isDivided(c) { return !!(c && (c.slots || []).length > 1); }

    function containerName(id) {
      const c = containers.find(c => c.id === id);
      return (c && c.name) ? c.name : id;
    }


    function seedStock(results) {
      flushPending();               // never let a re-render swallow a pending take
      stock.clear();
      for (const h of results) {
        const it = h.item || {};
        stock.set(stockKey(h.container, h.slot, h.index), {
          container: h.container, slot: h.slot, index: h.index, item: it,
          qty: it.qty_estimate == null ? 1 : it.qty_estimate, timer: null
        });
      }
    }

    function flushPending() {
      for (const [key, entry] of stock) {
        if (!entry.timer) continue;
        clearTimeout(entry.timer);
        entry.timer = null;
        save(key);
      }
    }

    function adjust(li, delta) {
      const key = stockKey(li.dataset.container, li.dataset.slot, +li.dataset.index);
      const entry = stock.get(key);
      if (!entry) return;
      const next = Math.max(0, entry.qty + delta);
      if (next === entry.qty) return;
      entry.qty = next;
      paint(li, next);
      clearTimeout(entry.timer);
      entry.timer = setTimeout(() => { entry.timer = null; save(key); }, SAVE_AFTER);
    }

    function paint(li, qty) {
      const n = li.querySelector('.n');
      if (n) n.textContent = qty;
      const minus = li.querySelector('.minus');
      if (minus) minus.disabled = qty <= 0;
    }

    async function save(key) {
      const entry = stock.get(key);
      if (!entry) return;
      const it = entry.item;
      const was = it.qty_estimate == null ? 1 : it.qty_estimate;
      if (entry.qty === was) return;
      try {
        const res = await fetch('/c/' + entry.container + '/' + entry.slot + '/items/' + entry.index, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: it.name || '',
            description: it.description || '',
            part_number: it.part_number || null,
            category: it.category || '',
            qty_estimate: entry.qty,
            tags: it.tags || []
          })
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const taken = was - entry.qty;
        it.qty_estimate = entry.qty;
        status.className = 'status ok';
        status.textContent = (taken > 0 ? 'Took ' + taken : 'Put back ' + -taken) + ' · '
          + itemName(it) + ' now ×' + entry.qty + ' in ' + placeName(entry.container, entry.slot) + '.';
      } catch (e) {
        entry.qty = was;              // the drawer is the truth; put the number back
        const li = hits.querySelector('li[data-container="' + entry.container + '"]'
          + '[data-slot="' + entry.slot + '"][data-index="' + entry.index + '"]');
        if (li) paint(li, was);
        status.className = 'status error';
        status.textContent = 'Could not update the count: ' + e.message;
      }
    }

    // Searching by photo is for the part in your hand that you cannot name, so
    // there is nothing to type and nothing to widen a second time — one request,
    // and the vision model's reading of the part becomes the query.
    shoot.addEventListener('click', () => photo.click());
    photo.addEventListener('change', async () => {
      const files = [...photo.files];
      photo.value = '';
      if (!files.length) return;

      clearTimeout(debounce);
      clearTimeout(smartDebounce);
      if (controller) controller.abort();
      if (smartController) smartController.abort();
      q.value = '';
      shoot.disabled = true;
      status.className = 'status';
      status.textContent = 'Reading the photo...';
      hits.innerHTML = '';
      // Yield a frame so that lands before the canvas work starts: coming back
      // from the camera, iOS otherwise holds the repaint until the next touch.
      await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
      try {
        const form = new FormData();
        for (const file of files) form.append('photo', await resize(file));
        const res = await fetch('/search/photo', { method: 'POST', body: form });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const result = await res.json();
        q.value = result.query || '';        // leave the reading behind to edit
        renderResult(result);
        if (window.rackUsage) rackUsage.refresh();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Photo search failed: ' + e.message;
      } finally {
        shoot.disabled = false;
      }
    });

    const resize = (file) => window.rackPhotos.resize(file);

    function renderHits(results, query, expanded) {
      const alsoTried = expanded.length
        ? ' Also searched for ' + expanded.map(t => '"' + esc(t) + '"').join(', ') + '.'
        : '';
      if (!results.length) {
        status.className = 'status';
        status.innerHTML = 'No matches for "' + esc(query) + '".' + alsoTried;
        hits.innerHTML = '';
        return;
      }
      status.className = 'status';
      status.innerHTML = results.length + ' match' + (results.length === 1 ? '' : 'es') +
        ' for "' + esc(query) + '".' + alsoTried;
      seedStock(results);
      hits.innerHTML = groupBySlot(results).map(renderGroup).join('');
      wireEvents();
    }

    function groupBySlot(results) {
      const groups = new Map();
      for (const h of results) {
        const key = h.container + '/' + h.slot;
        if (!groups.has(key)) {
          groups.set(key, { container: h.container, slot: h.slot, lastVerified: h.last_verified, photos: h.photos || [], hits: [], topScore: 0 });
        }
        const g = groups.get(key);
        g.hits.push(h);
        if (h.score > g.topScore) g.topScore = h.score;
      }
      return [...groups.values()].sort((a, b) => b.topScore - a.topScore);
    }

    function renderGroup(g) {
      const location = placeName(g.container, g.slot);
      const putUrl = '/put.html?c=' + encodeURIComponent(g.container) + '&s=' + encodeURIComponent(g.slot);
      const staleBadge = staleBadgeIfNeeded(g.lastVerified);
      const itemsHtml = g.hits.map(h => renderHitItem(h, g)).join('');
      return '<li class="group">' +
        '<div class="loc"><a href="' + putUrl + '">' + esc(location) + '</a>' + staleBadge + '</div>' +
        '<ul class="items">' + itemsHtml + '</ul>' +
      '</li>';
    }


    // An item filed since the extractor was asked for every frame knows which
    // ones show it, and those are what you want. Older items only ever recorded
    // the one frame they were read from, so they fall back to the slot's own —
    // which is what they showed before, honestly labelled.
    function photoStrip(item, slotPhotos, urlOf, container) {
      const source = item.source_photo;
      const own = (item.seen_in || []).filter(Boolean);
      const list = own.length ? own : (slotPhotos || []).filter(Boolean);
      if (!list.length) return '';
      const ordered = source && list.includes(source)
        ? [source].concat(list.filter(p => p !== source))
        : list;
      const heading = own.length ? 'Photos of this item' : 'Photos of this ' + slotWord(container);
      return '<div class="shots"><h4>' + heading + '</h4><div class="strip">' +
        ordered.map(fn =>
          '<a class="frame' + (fn === source ? ' source' : '') + '" href="' + urlOf(fn) +
            '" target="_blank" rel="noopener" onclick="event.stopPropagation()">' +
            '<img src="' + urlOf(fn) + '" alt="" loading="lazy">' +
            (fn === source ? '<span class="badge">read from this</span>' : '') +
          '</a>').join('') +
      '</div></div>';
    }

    // Photographs live in one folder for the whole rack, so the drawer is not
    // part of the address — which is what lets a moved item keep its pictures.
    function photoUrl(fn) {
      return '/photos/' + encodeURIComponent(fn);
    }

    function renderHitItem(h, g) {
      const it = h.item || {};
      const tags = (it.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
      const qty = it.qty_estimate == null ? 1 : it.qty_estimate;
      const tagsCsv = (it.tags || []).join(', ');
      const thumb = it.source_photo
        ? '<a href="' + photoUrl(it.source_photo) + '" target="_blank" onclick="event.stopPropagation()"><img class="thumb" src="' + photoUrl(it.source_photo) + '" alt=""></a>'
        : '<div class="thumb-placeholder" title="no photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div>';
      return '<li data-container="' + esc(g.container) + '" data-slot="' + esc(g.slot) + '" data-index="' + h.index + '">' +
        '<div class="row">' +
          thumb +
          '<div class="body">' +
            '<div class="desc">' + esc(itemName(it)) + '</div>' +
            (itemDetail(it) ? '<div class="detail">' + esc(itemDetail(it)) + '</div>' : '') +
            (it.part_number ? '<div class="pn-line pn">' + esc(it.part_number) + '</div>' : '') +
            (tags ? '<div class="tags-line">' + tags + '</div>' : '') +
          '</div>' +
          '<div class="take">' +
            '<button type="button" class="step minus" title="Take one"' + (qty <= 0 ? ' disabled' : '') + '>&minus;</button>' +
            '<span class="qty">&times;<span class="n">' + qty + '</span></span>' +
            '<button type="button" class="step plus" title="Put one back">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="edit-form">' +
          '<label>Name</label><input class="f-name" type="text" value="' + esc(it.name || '') + '">' +
          '<label>Description</label><textarea class="f-description" rows="2">' + esc(it.description || '') + '</textarea>' +
          '<label>Part number</label><input class="f-part_number" type="text" value="' + esc(it.part_number || '') + '">' +
          '<label>Category</label><input class="f-category" type="text" value="' + esc(it.category || '') + '">' +
          '<label>Quantity</label><input class="f-qty_estimate" type="number" min="0" value="' + qty + '">' +
          '<label>Tags (comma separated)</label><input class="f-tags" type="text" value="' + esc(tagsCsv) + '">' +
          '<div class="edit-actions">' +
            '<button class="btn cancel">Cancel</button>' +
            '<button class="btn primary save">Save</button>' +
            '<button class="remove" title="Remove this item">Remove</button>' +
          '</div>' +
          photoStrip(it, g.photos, photoUrl, containerOf(g.container)) +
          '<div class="ai">' +
            '<h4>Ask AI about this item</h4>' +
            renderQaLog(it.qa || []) +
            '<div class="ai-input">' +
              '<input class="ai-q" type="text" placeholder="e.g. what is this pin?">' +
              '<button class="btn ask-btn">Ask</button>' +
            '</div>' +
          '</div>' +
          '<details class="merge-panel">' +
            '<summary>Merge into another item here…</summary>' +
            '<div class="merge-body">' +
              '<p class="merge-hint">Adds this row\'s count and photos into the one you pick, and removes this row. The other row\'s wording is kept.</p>' +
              '<div class="merge-targets"></div>' +
            '</div>' +
          '</details>' +
          '<details class="move-panel">' +
            '<summary>Move to another place…</summary>' +
            '<div class="move-body">' +
              '<div class="picker-label">Container</div>' +
              '<div class="containers move-containers"></div>' +
              '<div class="picker-label">Place</div>' +
              '<div class="slots-grid move-slots"></div>' +
              '<button class="btn primary move-btn" disabled>Pick a destination</button>' +
            '</div>' +
          '</details>' +
        '</div>' +
      '</li>';
    }

    // Items catalogued before the name/description split carry only a description.
    // Clip it for the title line rather than migrating what is on disk.
    function itemName(it) {
      if (it.name && it.name.trim()) return it.name.trim();
      const d = (it.description || '').trim();
      if (!d) return '(unknown)';
      return d.length <= 42 ? d : d.slice(0, 42).replace(/[\s,;:—–-]+\S*$/, '') + '…';
    }

    function itemDetail(it) {
      const d = (it.description || '').trim();
      if (it.name && it.name.trim()) return d;
      return d === itemName(it) ? '' : d;   // don't repeat a description used as the title
    }

    function renderQaLog(qa) {
      if (!qa.length) return '';
      const recent = qa.slice(-2);
      const older = qa.slice(0, -2);
      const olderHtml = older.length
        ? '<details class="qa-history"><summary>Show ' + older.length + ' earlier question' + (older.length === 1 ? '' : 's') + '</summary>' +
            '<ul class="qa-log">' + older.map(qaItem).join('') + '</ul>' +
          '</details>'
        : '';
      return olderHtml + '<ul class="qa-log">' + recent.map(qaItem).join('') + '</ul>';
    }

    function qaItem(x) {
      return '<li><div class="q">Q: ' + esc(x.question) + '</div><div class="a">' + md(x.answer) + '</div></li>';
    }

    function md(text) {
      const escaped = esc(text);
      const blocks = escaped.split(/\n\s*\n/);
      return blocks.map(renderBlock).join('');
    }

    function renderBlock(block) {
      const trimmed = block.trim();
      if (!trimmed) return '';
      if (/^---+$/.test(trimmed)) return '<hr>';
      const heading = trimmed.match(/^(#{1,4})\s+(.+)$/);
      if (heading && !trimmed.includes('\n')) {
        const level = heading[1].length;
        return '<h' + level + '>' + inline(heading[2]) + '</h' + level + '>';
      }
      const lines = trimmed.split('\n');
      if (lines.every(l => /^\s*[-*]\s+/.test(l))) {
        return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*]\s+/, '')) + '</li>').join('') + '</ul>';
      }
      return '<p>' + inline(trimmed).replace(/\n/g, '<br>') + '</p>';
    }

    function inline(s) {
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      return s;
    }

    function wireEvents() {
      hits.querySelectorAll('.items > li').forEach(li => {
        li.addEventListener('click', ev => {
          if (li.classList.contains('editing')) return;
          if (ev.target.closest('.edit-form')) return;
          li.classList.add('editing');
        });
      });
      hits.querySelectorAll('.step').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();                       // taking stock must not open the form
        adjust(b.closest('li'), b.classList.contains('minus') ? -1 : 1);
      }));
      hits.querySelectorAll('.cancel').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); b.closest('li').classList.remove('editing'); }));
      hits.querySelectorAll('.save').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); saveHit(b.closest('li')); }));
      hits.querySelectorAll('.remove').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); removeHit(b.closest('li')); }));
      hits.querySelectorAll('.ask-btn').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); askHit(b.closest('li')); }));
      hits.querySelectorAll('.ai-q').forEach(inp => inp.addEventListener('click', e => e.stopPropagation()));
      hits.querySelectorAll('.merge-panel').forEach(panel => wireMergePanel(panel));
      hits.querySelectorAll('.move-panel').forEach(panel => wireMovePanel(panel));
    }

    // Whether two rows are the same thing is a person's judgement, so this only
    // lists the drawer's other rows and does what it is told.
    function wireMergePanel(panel) {
      const host = panel.querySelector('.merge-targets');
      const li = panel.closest('li');
      const { container, slot } = li.dataset;
      const from = +li.dataset.index;
      panel.addEventListener('click', ev => ev.stopPropagation());
      panel.addEventListener('toggle', async () => {
        if (!panel.open || host.children.length) return;
        host.innerHTML = '<p class="merge-hint">Loading…</p>';
        let items = [];
        try {
          const res = await fetch('/c/' + container + '/' + slot);
          if (res.ok) items = (await res.json()).items || [];
        } catch (e) { /* handled below */ }
        // Every row in the drawer, not just the ones that matched the search:
        // the thing you are merging into may not be a hit at all.
        const others = items.map((it, idx) => ({ it, idx })).filter(o => o.idx !== from);
        if (!others.length) {
          host.innerHTML = '<p class="merge-hint">Nothing else in this drawer to merge into.</p>';
          return;
        }
        host.innerHTML = '';
        others.forEach(o => {
          const qty = o.it.qty_estimate == null ? 1 : o.it.qty_estimate;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn block merge-into';
          btn.textContent = 'Merge into ' + itemName(o.it) + ' (×' + qty + ')';
          btn.addEventListener('click', ev => { ev.stopPropagation(); mergeInto(container, slot, from, o.idx, btn); });
          host.appendChild(btn);
        });
      });
    }

    async function mergeInto(container, slot, from, into, btn) {
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Merging…';
      try {
        const res = await fetch('/c/' + container + '/' + slot + '/items/' + from + '/merge', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ into })
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        status.className = 'status ok';
        // The kept wording was written for the smaller count, and the row it is
        // on has just moved — re-run the search rather than patch the list.
        status.textContent = '✓ Merged in ' + placeName(container, slot)
          + '. Open it to check the description still fits.';
        runSearch();
      } catch (e) {
        btn.disabled = false;
        btn.textContent = original;
        status.className = 'status error';
        status.textContent = 'Merge failed: ' + e.message;
      }
    }

    function wireMovePanel(panel) {
      const containersHost = panel.querySelector('.move-containers');
      const slotsHost = panel.querySelector('.move-slots');
      const moveBtn = panel.querySelector('.move-btn');
      const li = panel.closest('li');
      const srcContainer = li.dataset.container;
      const srcSlot = li.dataset.slot;
      let picked = { container: null, slot: null };

      panel.addEventListener('click', ev => ev.stopPropagation());
      panel.addEventListener('toggle', () => {
        if (panel.open && !containersHost.children.length) drawContainers();
      });

      function drawContainers() {
        containersHost.innerHTML = '';
        containers.forEach(c => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'container-btn';
          btn.textContent = c.name || c.id;
          btn.addEventListener('click', ev => { ev.stopPropagation(); pickContainer(c, btn); });
          containersHost.appendChild(btn);
        });
      }

      async function pickContainer(c, btn) {
        picked.container = c;
        picked.slot = null;
        containersHost.querySelectorAll('.container-btn').forEach(el => el.classList.toggle('selected', el === btn));
        // A container with one storage space has nowhere else to go: choosing
        // it has already chosen the destination.
        if ((c.slots || []).length <= 1) {
          picked.slot = (c.slots || [])[0] || null;
          slotsHost.innerHTML = '';
          moveBtn.disabled = !picked.slot;
          moveBtn.textContent = 'Move to ' + (c.name || c.id);
          return;
        }
        slotsHost.innerHTML = '<span style="font-size:.8rem;color:var(--muted)">Loading…</span>';
        moveBtn.disabled = true;
        moveBtn.textContent = 'Pick a destination';
        let filled = new Set();
        try {
          const res = await fetch('/c/' + c.id + '/summary');
          if (res.ok) {
            const summary = await res.json();
            filled = new Set(summary.filter(s => s.item_count > 0).map(s => s.slot));
          }
        } catch (e) { /* ignore */ }
        drawSlots(c, filled);
      }

      function drawSlots(c, filled) {
        slotsHost.innerHTML = '';
        (c.slots || []).forEach(sid => {
          const isCurrent = c.id === srcContainer && sid === srcSlot;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'slot-btn' + (filled.has(sid) ? ' filled' : '') + (isCurrent ? ' selected' : '');
          btn.textContent = sid;
          btn.disabled = isCurrent;
          if (isCurrent) btn.title = 'current slot';
          btn.addEventListener('click', ev => { ev.stopPropagation(); pickSlot(sid, btn); });
          slotsHost.appendChild(btn);
        });
      }

      function pickSlot(sid, btn) {
        picked.slot = sid;
        slotsHost.querySelectorAll('.slot-btn').forEach(el => el.classList.toggle('selected', el === btn));
        moveBtn.disabled = false;
        moveBtn.textContent = 'Move to ' + (picked.container.name || picked.container.id) + ' · ' + sid;
      }

      moveBtn.addEventListener('click', async ev => {
        ev.stopPropagation();
        if (!picked.container || !picked.slot) return;
        const idx = +li.dataset.index;
        const original = moveBtn.textContent;
        moveBtn.disabled = true;
        moveBtn.textContent = 'Moving…';
        try {
          const res = await fetch('/c/' + srcContainer + '/' + srcSlot + '/items/' + idx + '/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target_container: picked.container.id, target_slot: picked.slot })
          });
          if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
          status.className = 'status ok';
          status.textContent = '✓ Moved to ' + (picked.container.name || picked.container.id) + ' · ' + picked.slot + '.';
          runSearch();
        } catch (e) {
          status.className = 'status error';
          status.textContent = 'Move failed: ' + e.message;
          moveBtn.disabled = false;
          moveBtn.textContent = original;
        }
      });
    }

    async function askHit(li) {
      const { container, slot, index } = li.dataset;
      const input = li.querySelector('.ai-q');
      const question = input.value.trim();
      if (!question) return;
      const askBtn = li.querySelector('.ask-btn');
      askBtn.disabled = true;
      askBtn.textContent = '…';
      try {
        const res = await fetch('/c/' + container + '/' + slot + '/items/' + index + '/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const slotData = await res.json();
        const latestItem = slotData.items[+index];
        const latestQA = (latestItem.qa || []).slice(-1)[0];
        appendQaEntry(li, latestQA);
        if (window.rackUsage) rackUsage.refresh();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Ask failed: ' + e.message;
      } finally {
        askBtn.disabled = false;
        askBtn.textContent = 'Ask';
        input.value = '';
        input.focus();
      }
    }

    function appendQaEntry(li, entry) {
      if (!entry) return;
      const ai = li.querySelector('.ai');
      let log = ai.querySelector('.qa-log');
      if (!log) {
        log = document.createElement('ul');
        log.className = 'qa-log';
        ai.insertBefore(log, ai.querySelector('.ai-input'));
      }
      const item = document.createElement('li');
      item.innerHTML = '<div class="q">Q: ' + esc(entry.question) + '</div><div class="a">' + md(entry.answer) + '</div>';
      log.appendChild(item);
    }

    async function saveHit(li) {
      const payload = {
        name: li.querySelector('.f-name').value,
        description: li.querySelector('.f-description').value,
        part_number: li.querySelector('.f-part_number').value || null,
        category: li.querySelector('.f-category').value,
        qty_estimate: parseInt(li.querySelector('.f-qty_estimate').value, 10) || 0,
        tags: li.querySelector('.f-tags').value.split(',').map(s => s.trim()).filter(Boolean)
      };
      if (payload.qty_estimate <= 0) return removeHit(li);
      const { container, slot, index } = li.dataset;
      try {
        const res = await fetch('/c/' + container + '/' + slot + '/items/' + index, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        runSearch();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Save failed: ' + e.message;
      }
    }

    async function removeHit(li) {
      const { container, slot, index } = li.dataset;
      try {
        const res = await fetch('/c/' + container + '/' + slot + '/items/' + index, { method: 'DELETE' });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        runSearch();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Remove failed: ' + e.message;
      }
    }

    function staleBadgeIfNeeded(iso) {
      if (!iso) return '<span class="verified never">not yet verified</span>';
      const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
      if (days <= 180) return '';
      return '<span class="verified stale">stale · ' + days + ' days ago</span>';
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
  <script src="/assets/usage.js" defer></script>
</body>
