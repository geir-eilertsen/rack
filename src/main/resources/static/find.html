<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — find</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 640px; color: #222; }
    .back { color: #666; text-decoration: none; font-size: .85rem; }
    .back:hover { color: #222; }
    h1 { font-size: 1.2rem; margin: .25rem 0 1rem; }
    .search { display: flex; gap: .3rem; margin-bottom: 1rem; }
    .search input { flex: 1; padding: .6rem .75rem; font: inherit; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    .status { color: #666; font-size: .9rem; margin-bottom: .5rem; }
    .status.error { color: #b00020; }
    .hits { list-style: none; padding: 0; margin: 0; }
    .group { padding: .75rem; border: 1px solid #ddd; border-radius: 6px; margin-bottom: .75rem; }
    .group .loc { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .35rem; }
    .group .loc a { color: #333; font-weight: 600; text-decoration: none; font-family: ui-monospace, SFMono-Regular, monospace; }
    .group .loc a:hover { text-decoration: underline; }
    .verified { font-size: .75rem; color: #666; }
    .verified.stale { color: #b58900; }
    .verified.never { color: #999; }
    .photos { display: flex; gap: .25rem; flex-wrap: wrap; margin: .35rem 0; }
    .photos img { width: 64px; height: 64px; object-fit: cover; border: 1px solid #ddd; border-radius: 4px; }
    .group ul.items { list-style: none; padding: 0; margin: .5rem 0 0; }
    .group ul.items > li { padding: .5rem 0; border-top: 1px solid #eee; }
    .group ul.items > li:first-child { border-top: none; padding-top: 0; }
    .group h3 { margin: 0; font-size: .95rem; display: inline; }
    .group .edit { border: none; background: transparent; color: #333; font-size: .95rem; cursor: pointer; padding: 0 .3rem; float: right; }
    .group .edit:hover { color: #000; }
    .pn { font-family: ui-monospace, SFMono-Regular, monospace; color: #444; font-size: .85rem; }
    .meta { font-size: .8rem; color: #666; margin-top: .2rem; }
    .tags { margin-top: .2rem; }
    .tag { display: inline-block; background: #eef; padding: .1rem .5rem; border-radius: 999px; margin: .1rem .1rem 0 0; font-size: .7rem; }
    .edit-form { margin-top: .5rem; padding-top: .5rem; border-top: 1px solid #eee; display: none; flex-direction: column; gap: .3rem; }
    li.editing .edit-form { display: flex; }
    .edit-form label { font-size: .75rem; color: #666; }
    .edit-form input { font: inherit; font-size: .9rem; padding: .35rem .5rem; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box; }
    .edit-form .row { display: flex; gap: .3rem; margin-top: .3rem; }
    .edit-form .row button { flex: 1; padding: .5rem; border-radius: 4px; border: 1px solid #ccc; background: #fff; cursor: pointer; font: inherit; font-size: .9rem; }
    .edit-form .row button.save { background: #333; color: #fff; border-color: #333; }
  </style>
</head>
<body>
  <a class="back" href="/">&larr; rack</a>
  <h1>find</h1>

  <div class="search">
    <input id="q" type="search" placeholder="e.g. BC547, transistor, TO-220, red LED" autocomplete="off" autofocus>
  </div>
  <div class="status" id="status">Type to search.</div>
  <ul class="hits" id="hits"></ul>

  <script>
    const q = document.getElementById('q');
    const status = document.getElementById('status');
    const hits = document.getElementById('hits');

    let controller = null;
    let debounce = null;
    let currentQuery = '';

    q.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(runSearch, 250);
    });

    async function runSearch() {
      const query = q.value.trim();
      currentQuery = query;
      if (!query) {
        status.className = 'status';
        status.textContent = 'Type to search.';
        hits.innerHTML = '';
        return;
      }
      if (controller) controller.abort();
      controller = new AbortController();
      status.className = 'status';
      status.textContent = 'Searching...';
      try {
        const res = await fetch('/search?q=' + encodeURIComponent(query), { signal: controller.signal });
        if (!res.ok) throw new Error(await res.text() || ('HTTP ' + res.status));
        const results = await res.json();
        renderHits(results, query);
      } catch (e) {
        if (e.name === 'AbortError') return;
        status.className = 'status error';
        status.textContent = 'Search failed: ' + e.message;
      }
    }

    function renderHits(results, query) {
      if (!results.length) {
        status.className = 'status';
        status.textContent = 'No matches for "' + esc(query) + '".';
        hits.innerHTML = '';
        return;
      }
      status.className = 'status';
      status.textContent = results.length + ' match' + (results.length === 1 ? '' : 'es') + ' for "' + esc(query) + '".';
      hits.innerHTML = groupBySlot(results).map(renderGroup).join('');
      wireHitEvents();
    }

    function groupBySlot(results) {
      const groups = new Map();
      for (const h of results) {
        const key = h.container + '/' + h.slot;
        if (!groups.has(key)) {
          groups.set(key, {
            container: h.container,
            slot: h.slot,
            lastVerified: h.last_verified,
            photos: h.photos || [],
            hits: [],
            topScore: 0
          });
        }
        const g = groups.get(key);
        g.hits.push(h);
        if (h.score > g.topScore) g.topScore = h.score;
      }
      return [...groups.values()].sort((a, b) => b.topScore - a.topScore);
    }

    function renderGroup(g) {
      const location = g.container + ' · ' + g.slot;
      const putUrl = '/put.html?c=' + encodeURIComponent(g.container) + '&s=' + encodeURIComponent(g.slot);
      const photoStrip = g.photos.slice(0, 6).map(fn => {
        const url = '/c/' + encodeURIComponent(g.container) + '/' + encodeURIComponent(g.slot) + '/photos/' + encodeURIComponent(fn);
        return '<a href="' + url + '" target="_blank"><img src="' + url + '" alt=""></a>';
      }).join('');
      const itemsHtml = g.hits.map(h => renderHitItem(h, g)).join('');
      return '<li class="group">' +
        '<div class="loc"><a href="' + putUrl + '">' + esc(location) + '</a>' + verifiedBadge(g.lastVerified) + '</div>' +
        (photoStrip ? '<div class="photos">' + photoStrip + '</div>' : '') +
        '<ul class="items">' + itemsHtml + '</ul>' +
      '</li>';
    }

    function renderHitItem(h, g) {
      const it = h.item || {};
      const tags = (it.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
      const conf = it.confidence != null ? Math.round(it.confidence * 100) + '%' : '?';
      const qty = it.qty_estimate != null ? it.qty_estimate : '?';
      const tagsCsv = (it.tags || []).join(', ');
      return '<li data-container="' + esc(g.container) + '" data-slot="' + esc(g.slot) + '" data-index="' + h.index + '">' +
        '<h3>' + esc(it.description || '(unknown)') + '</h3>' +
        '<button class="edit" title="edit">&#9998;</button>' +
        (it.part_number ? '<div class="pn">' + esc(it.part_number) + '</div>' : '') +
        '<div class="meta">' + esc(it.category || '') + ' · qty ' + qty + ' · conf ' + conf + '</div>' +
        (tags ? '<div class="tags">' + tags + '</div>' : '') +
        '<div class="edit-form">' +
          '<label>Description</label><input class="f-description" value="' + esc(it.description || '') + '">' +
          '<label>Part number</label><input class="f-part_number" value="' + esc(it.part_number || '') + '">' +
          '<label>Category</label><input class="f-category" value="' + esc(it.category || '') + '">' +
          '<label>Quantity</label><input class="f-qty_estimate" type="number" min="0" value="' + (it.qty_estimate != null ? it.qty_estimate : 1) + '">' +
          '<label>Tags (comma separated)</label><input class="f-tags" value="' + esc(tagsCsv) + '">' +
          '<div class="row"><button class="cancel">Cancel</button><button class="save">Save</button></div>' +
        '</div>' +
      '</li>';
    }

    function wireHitEvents() {
      hits.querySelectorAll('.edit').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        b.closest('li').classList.toggle('editing');
      }));
      hits.querySelectorAll('.cancel').forEach(b => b.addEventListener('click', () => b.closest('li').classList.remove('editing')));
      hits.querySelectorAll('.save').forEach(b => b.addEventListener('click', () => saveHit(b.closest('li'))));
    }

    async function saveHit(li) {
      const container = li.dataset.container;
      const slot = li.dataset.slot;
      const idx = +li.dataset.index;
      const payload = {
        description: li.querySelector('.f-description').value,
        part_number: li.querySelector('.f-part_number').value || null,
        category: li.querySelector('.f-category').value,
        qty_estimate: parseInt(li.querySelector('.f-qty_estimate').value, 10) || 1,
        tags: li.querySelector('.f-tags').value.split(',').map(s => s.trim()).filter(Boolean)
      };
      try {
        const res = await fetch('/c/' + container + '/' + slot + '/items/' + idx, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        // Re-run current search so the hit reflects the edit
        runSearch();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Edit failed: ' + e.message;
      }
    }

    function verifiedBadge(iso) {
      if (!iso) return '<span class="verified never">never verified</span>';
      const d = new Date(iso);
      const days = Math.floor((Date.now() - d.getTime()) / 86400000);
      const label = days === 0 ? 'today' : days === 1 ? 'yesterday' : days + ' days ago';
      const stale = days > 180;
      return '<span class="verified' + (stale ? ' stale' : '') + '">verified ' + label + '</span>';
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
</body>
</html>
