<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rack — find an item</title>
  <link rel="icon" type="image/svg+xml" href="/assets/rack.svg">
  <link rel="apple-touch-icon" href="/assets/rack.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#d97747">
  <link rel="stylesheet" href="/assets/rack.css">
  <style>
    .search { margin-bottom: 1rem; }
    .search input { font-size: 1.05rem; padding: .8rem 1rem; }
    .hits { list-style: none; padding: 0; margin: 0; }
    .group { padding: 1rem; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: .75rem; background: var(--card); box-shadow: var(--shadow); }
    .group .loc { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .35rem; }
    .group .loc a { color: var(--primary-hover); font-weight: 700; text-decoration: none; font-family: var(--font-mono); font-size: 1.05rem; }
    .group .loc a:hover { text-decoration: underline; }
    .group ul.items { list-style: none; padding: 0; margin: .6rem 0 0; }
    .group ul.items > li { padding: .65rem .75rem; border-top: 1px solid var(--border); cursor: pointer; transition: background .12s ease; border-radius: var(--radius-xs); }
    .group ul.items > li:first-child { border-top: none; }
    .group ul.items > li:hover { background: var(--primary-soft); }
    .group ul.items > li.editing { cursor: default; background: var(--card); }
    .row { display: flex; align-items: center; gap: .5rem; }
    .thumb { flex: 0 0 auto; width: 48px; height: 48px; object-fit: cover; border-radius: var(--radius-xs); border: 1px solid var(--border); }
    .thumb-placeholder { flex: 0 0 auto; width: 48px; height: 48px; border-radius: var(--radius-xs); background: var(--primary-soft); display: flex; align-items: center; justify-content: center; color: var(--primary); }
    .body { flex: 1; min-width: 0; }
    .desc { font-weight: 500; font-size: .95rem; }
    .detail { font-size: .82rem; color: var(--muted); margin-top: .15rem; font-weight: 400; }
    .qty { font-family: var(--font-mono); font-weight: 700; color: var(--primary-hover); font-size: .9rem; }
    .pn-line { margin-top: .2rem; }
    .tags-line { margin-top: .3rem; }
    .editing .row, .editing .pn-line, .editing .tags-line { display: none; }
    .edit-form { display: none; flex-direction: column; gap: .35rem; }
    .editing .edit-form { display: flex; }
    .edit-form label { font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-top: .35rem; }
    .edit-actions { display: flex; gap: .4rem; margin-top: .5rem; align-items: center; }
    .edit-actions .btn { flex: 1; }
    .edit-actions .remove { flex: 0 0 auto; background: transparent; border: none; color: var(--error); font-size: .85rem; cursor: pointer; padding: .3rem .5rem; text-decoration: underline; }
    .edit-actions .remove:hover { color: #7a2a20; }
    .ai { margin-top: .8rem; padding-top: .8rem; border-top: 1px solid var(--border); }
    .ai h4 { margin: 0 0 .4rem; font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .ai-input { display: flex; gap: .3rem; }
    .ai-input input { flex: 1; }
    .ai-input .ask-btn { flex: 0 0 auto; padding: .55rem .9rem; }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <a class="back" href="/">← Home</a>
      <a class="brand" href="/">
        <img class="logo" src="/assets/rack.svg" alt="">
        <span class="name">rack</span>
      </a>
    </header>

    <h1>Find an item</h1>

    <div class="search">
      <input id="q" type="search" placeholder="e.g. transistor, TO-220, red LED" autocomplete="off" autofocus>
    </div>
    <div class="status" id="status">Type to search.</div>
    <ul class="hits" id="hits"></ul>
  </div>

  <script>
    const q = document.getElementById('q');
    const status = document.getElementById('status');
    const hits = document.getElementById('hits');

    let controller = null;
    let smartController = null;
    let debounce = null;
    let smartDebounce = null;
    let containers = [];
    fetch('/c').then(r => r.ok ? r.json() : []).then(list => containers = list).catch(() => {});

    q.addEventListener('input', () => {
      clearTimeout(debounce);
      clearTimeout(smartDebounce);
      debounce = setTimeout(runSearch, 250);
    });

    // Two passes. The first is pure keyword matching — no model call, so it can
    // land while you are still typing. Once typing settles the second asks the
    // server to widen the query, which it only does when the first came up short
    // (searching "isolating tape" and getting the electrical tape). Results are
    // already on screen by then; the widened set replaces them if it found more.
    async function runSearch() {
      const query = q.value.trim();
      if (!query) {
        status.className = 'status';
        status.textContent = 'Type to search.';
        hits.innerHTML = '';
        return;
      }
      if (controller) controller.abort();
      controller = new AbortController();
      status.className = 'status';
      status.textContent = 'Searching...';
      try {
        const res = await fetch('/search?q=' + encodeURIComponent(query), { signal: controller.signal });
        if (!res.ok) throw new Error(await res.text() || ('HTTP ' + res.status));
        renderResult(await res.json());
      } catch (e) {
        if (e.name === 'AbortError') return;
        status.className = 'status error';
        status.textContent = 'Search failed: ' + e.message;
        return;
      }
      clearTimeout(smartDebounce);
      smartDebounce = setTimeout(() => runSmartSearch(query), 400);
    }

    async function runSmartSearch(query) {
      if (smartController) smartController.abort();
      smartController = new AbortController();
      try {
        const res = await fetch('/search?q=' + encodeURIComponent(query) + '&smart=true', { signal: smartController.signal });
        if (!res.ok) return;                       // the literal results still stand
        const result = await res.json();
        if (q.value.trim() !== query) return;      // typing moved on
        if (result.expanded_terms && result.expanded_terms.length) renderResult(result);
      } catch (e) { /* the literal results still stand */ }
    }

    function renderResult(result) {
      renderHits(result.hits || [], result.query, result.expanded_terms || []);
    }

    function renderHits(results, query, expanded) {
      const alsoTried = expanded.length
        ? ' Also searched for ' + expanded.map(t => '"' + esc(t) + '"').join(', ') + '.'
        : '';
      if (!results.length) {
        status.className = 'status';
        status.innerHTML = 'No matches for "' + esc(query) + '".' + alsoTried;
        hits.innerHTML = '';
        return;
      }
      status.className = 'status';
      status.innerHTML = results.length + ' match' + (results.length === 1 ? '' : 'es') +
        ' for "' + esc(query) + '".' + alsoTried;
      hits.innerHTML = groupBySlot(results).map(renderGroup).join('');
      wireEvents();
    }

    function groupBySlot(results) {
      const groups = new Map();
      for (const h of results) {
        const key = h.container + '/' + h.slot;
        if (!groups.has(key)) {
          groups.set(key, { container: h.container, slot: h.slot, lastVerified: h.last_verified, photos: h.photos || [], hits: [], topScore: 0 });
        }
        const g = groups.get(key);
        g.hits.push(h);
        if (h.score > g.topScore) g.topScore = h.score;
      }
      return [...groups.values()].sort((a, b) => b.topScore - a.topScore);
    }

    function renderGroup(g) {
      const location = g.container + ' · ' + g.slot;
      const putUrl = '/put.html?c=' + encodeURIComponent(g.container) + '&s=' + encodeURIComponent(g.slot);
      const staleBadge = staleBadgeIfNeeded(g.lastVerified);
      const itemsHtml = g.hits.map(h => renderHitItem(h, g)).join('');
      return '<li class="group">' +
        '<div class="loc"><a href="' + putUrl + '">' + esc(location) + '</a>' + staleBadge + '</div>' +
        '<ul class="items">' + itemsHtml + '</ul>' +
      '</li>';
    }

    function photoUrl(container, slot, fn) {
      return '/c/' + encodeURIComponent(container) + '/' + encodeURIComponent(slot) + '/photos/' + encodeURIComponent(fn);
    }

    function renderHitItem(h, g) {
      const it = h.item || {};
      const tags = (it.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
      const qty = it.qty_estimate == null ? 1 : it.qty_estimate;
      const tagsCsv = (it.tags || []).join(', ');
      const thumb = it.source_photo
        ? '<a href="' + photoUrl(g.container, g.slot, it.source_photo) + '" target="_blank" onclick="event.stopPropagation()"><img class="thumb" src="' + photoUrl(g.container, g.slot, it.source_photo) + '" alt=""></a>'
        : '<div class="thumb-placeholder" title="no photo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg></div>';
      return '<li data-container="' + esc(g.container) + '" data-slot="' + esc(g.slot) + '" data-index="' + h.index + '">' +
        '<div class="row">' +
          thumb +
          '<div class="body">' +
            '<div class="desc">' + esc(itemName(it)) + '</div>' +
            (itemDetail(it) ? '<div class="detail">' + esc(itemDetail(it)) + '</div>' : '') +
            (it.part_number ? '<div class="pn-line pn">' + esc(it.part_number) + '</div>' : '') +
            (tags ? '<div class="tags-line">' + tags + '</div>' : '') +
          '</div>' +
          '<div class="qty">×' + qty + '</div>' +
        '</div>' +
        '<div class="edit-form">' +
          '<label>Name</label><input class="f-name" type="text" value="' + esc(it.name || '') + '">' +
          '<label>Description</label><textarea class="f-description" rows="2">' + esc(it.description || '') + '</textarea>' +
          '<label>Part number</label><input class="f-part_number" type="text" value="' + esc(it.part_number || '') + '">' +
          '<label>Category</label><input class="f-category" type="text" value="' + esc(it.category || '') + '">' +
          '<label>Quantity</label><input class="f-qty_estimate" type="number" min="0" value="' + qty + '">' +
          '<label>Tags (comma separated)</label><input class="f-tags" type="text" value="' + esc(tagsCsv) + '">' +
          '<div class="edit-actions">' +
            '<button class="btn cancel">Cancel</button>' +
            '<button class="btn primary save">Save</button>' +
            '<button class="remove" title="Remove this item">Remove</button>' +
          '</div>' +
          '<div class="ai">' +
            '<h4>Ask AI about this item</h4>' +
            renderQaLog(it.qa || []) +
            '<div class="ai-input">' +
              '<input class="ai-q" type="text" placeholder="e.g. what is this pin?">' +
              '<button class="btn ask-btn">Ask</button>' +
            '</div>' +
          '</div>' +
          '<details class="move-panel">' +
            '<summary>Move to another slot…</summary>' +
            '<div class="move-body">' +
              '<div class="picker-label">Container</div>' +
              '<div class="containers move-containers"></div>' +
              '<div class="picker-label">Slot</div>' +
              '<div class="slots-grid move-slots"></div>' +
              '<button class="btn primary move-btn" disabled>Pick a destination</button>' +
            '</div>' +
          '</details>' +
        '</div>' +
      '</li>';
    }

    // Items catalogued before the name/description split carry only a description.
    // Clip it for the title line rather than migrating what is on disk.
    function itemName(it) {
      if (it.name && it.name.trim()) return it.name.trim();
      const d = (it.description || '').trim();
      if (!d) return '(unknown)';
      return d.length <= 42 ? d : d.slice(0, 42).replace(/[\s,;:—–-]+\S*$/, '') + '…';
    }

    function itemDetail(it) {
      const d = (it.description || '').trim();
      if (it.name && it.name.trim()) return d;
      return d === itemName(it) ? '' : d;   // don't repeat a description used as the title
    }

    function renderQaLog(qa) {
      if (!qa.length) return '';
      const recent = qa.slice(-2);
      const older = qa.slice(0, -2);
      const olderHtml = older.length
        ? '<details class="qa-history"><summary>Show ' + older.length + ' earlier question' + (older.length === 1 ? '' : 's') + '</summary>' +
            '<ul class="qa-log">' + older.map(qaItem).join('') + '</ul>' +
          '</details>'
        : '';
      return olderHtml + '<ul class="qa-log">' + recent.map(qaItem).join('') + '</ul>';
    }

    function qaItem(x) {
      return '<li><div class="q">Q: ' + esc(x.question) + '</div><div class="a">' + md(x.answer) + '</div></li>';
    }

    function md(text) {
      const escaped = esc(text);
      const blocks = escaped.split(/\n\s*\n/);
      return blocks.map(renderBlock).join('');
    }

    function renderBlock(block) {
      const trimmed = block.trim();
      if (!trimmed) return '';
      if (/^---+$/.test(trimmed)) return '<hr>';
      const heading = trimmed.match(/^(#{1,4})\s+(.+)$/);
      if (heading && !trimmed.includes('\n')) {
        const level = heading[1].length;
        return '<h' + level + '>' + inline(heading[2]) + '</h' + level + '>';
      }
      const lines = trimmed.split('\n');
      if (lines.every(l => /^\s*[-*]\s+/.test(l))) {
        return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*]\s+/, '')) + '</li>').join('') + '</ul>';
      }
      return '<p>' + inline(trimmed).replace(/\n/g, '<br>') + '</p>';
    }

    function inline(s) {
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      return s;
    }

    function wireEvents() {
      hits.querySelectorAll('.items > li').forEach(li => {
        li.addEventListener('click', ev => {
          if (li.classList.contains('editing')) return;
          if (ev.target.closest('.edit-form')) return;
          li.classList.add('editing');
        });
      });
      hits.querySelectorAll('.cancel').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); b.closest('li').classList.remove('editing'); }));
      hits.querySelectorAll('.save').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); saveHit(b.closest('li')); }));
      hits.querySelectorAll('.remove').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); removeHit(b.closest('li')); }));
      hits.querySelectorAll('.ask-btn').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); askHit(b.closest('li')); }));
      hits.querySelectorAll('.ai-q').forEach(inp => inp.addEventListener('click', e => e.stopPropagation()));
      hits.querySelectorAll('.move-panel').forEach(panel => wireMovePanel(panel));
    }

    function wireMovePanel(panel) {
      const containersHost = panel.querySelector('.move-containers');
      const slotsHost = panel.querySelector('.move-slots');
      const moveBtn = panel.querySelector('.move-btn');
      const li = panel.closest('li');
      const srcContainer = li.dataset.container;
      const srcSlot = li.dataset.slot;
      let picked = { container: null, slot: null };

      panel.addEventListener('click', ev => ev.stopPropagation());
      panel.addEventListener('toggle', () => {
        if (panel.open && !containersHost.children.length) drawContainers();
      });

      function drawContainers() {
        containersHost.innerHTML = '';
        containers.forEach(c => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'container-btn';
          btn.textContent = c.name || c.id;
          btn.addEventListener('click', ev => { ev.stopPropagation(); pickContainer(c, btn); });
          containersHost.appendChild(btn);
        });
      }

      async function pickContainer(c, btn) {
        picked.container = c;
        picked.slot = null;
        containersHost.querySelectorAll('.container-btn').forEach(el => el.classList.toggle('selected', el === btn));
        slotsHost.innerHTML = '<span style="font-size:.8rem;color:var(--muted)">Loading…</span>';
        moveBtn.disabled = true;
        moveBtn.textContent = 'Pick a destination';
        let filled = new Set();
        try {
          const res = await fetch('/c/' + c.id + '/summary');
          if (res.ok) {
            const summary = await res.json();
            filled = new Set(summary.filter(s => s.item_count > 0).map(s => s.slot));
          }
        } catch (e) { /* ignore */ }
        drawSlots(c, filled);
      }

      function drawSlots(c, filled) {
        slotsHost.innerHTML = '';
        (c.slots || []).forEach(sid => {
          const isCurrent = c.id === srcContainer && sid === srcSlot;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'slot-btn' + (filled.has(sid) ? ' filled' : '') + (isCurrent ? ' selected' : '');
          btn.textContent = sid;
          btn.disabled = isCurrent;
          if (isCurrent) btn.title = 'current slot';
          btn.addEventListener('click', ev => { ev.stopPropagation(); pickSlot(sid, btn); });
          slotsHost.appendChild(btn);
        });
      }

      function pickSlot(sid, btn) {
        picked.slot = sid;
        slotsHost.querySelectorAll('.slot-btn').forEach(el => el.classList.toggle('selected', el === btn));
        moveBtn.disabled = false;
        moveBtn.textContent = 'Move to ' + picked.container.id + '.' + sid;
      }

      moveBtn.addEventListener('click', async ev => {
        ev.stopPropagation();
        if (!picked.container || !picked.slot) return;
        const idx = +li.dataset.index;
        const original = moveBtn.textContent;
        moveBtn.disabled = true;
        moveBtn.textContent = 'Moving…';
        try {
          const res = await fetch('/c/' + srcContainer + '/' + srcSlot + '/items/' + idx + '/move', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target_container: picked.container.id, target_slot: picked.slot })
          });
          if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
          status.className = 'status ok';
          status.textContent = '✓ Moved to ' + picked.container.id + '.' + picked.slot + '.';
          runSearch();
        } catch (e) {
          status.className = 'status error';
          status.textContent = 'Move failed: ' + e.message;
          moveBtn.disabled = false;
          moveBtn.textContent = original;
        }
      });
    }

    async function askHit(li) {
      const { container, slot, index } = li.dataset;
      const input = li.querySelector('.ai-q');
      const question = input.value.trim();
      if (!question) return;
      const askBtn = li.querySelector('.ask-btn');
      askBtn.disabled = true;
      askBtn.textContent = '…';
      try {
        const res = await fetch('/c/' + container + '/' + slot + '/items/' + index + '/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        const slotData = await res.json();
        const latestItem = slotData.items[+index];
        const latestQA = (latestItem.qa || []).slice(-1)[0];
        appendQaEntry(li, latestQA);
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Ask failed: ' + e.message;
      } finally {
        askBtn.disabled = false;
        askBtn.textContent = 'Ask';
        input.value = '';
        input.focus();
      }
    }

    function appendQaEntry(li, entry) {
      if (!entry) return;
      const ai = li.querySelector('.ai');
      let log = ai.querySelector('.qa-log');
      if (!log) {
        log = document.createElement('ul');
        log.className = 'qa-log';
        ai.insertBefore(log, ai.querySelector('.ai-input'));
      }
      const item = document.createElement('li');
      item.innerHTML = '<div class="q">Q: ' + esc(entry.question) + '</div><div class="a">' + md(entry.answer) + '</div>';
      log.appendChild(item);
    }

    async function saveHit(li) {
      const payload = {
        name: li.querySelector('.f-name').value,
        description: li.querySelector('.f-description').value,
        part_number: li.querySelector('.f-part_number').value || null,
        category: li.querySelector('.f-category').value,
        qty_estimate: parseInt(li.querySelector('.f-qty_estimate').value, 10) || 0,
        tags: li.querySelector('.f-tags').value.split(',').map(s => s.trim()).filter(Boolean)
      };
      if (payload.qty_estimate <= 0) return removeHit(li);
      const { container, slot, index } = li.dataset;
      try {
        const res = await fetch('/c/' + container + '/' + slot + '/items/' + index, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        runSearch();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Save failed: ' + e.message;
      }
    }

    async function removeHit(li) {
      const { container, slot, index } = li.dataset;
      try {
        const res = await fetch('/c/' + container + '/' + slot + '/items/' + index, { method: 'DELETE' });
        if (!res.ok) throw new Error((await res.text()) || ('HTTP ' + res.status));
        runSearch();
      } catch (e) {
        status.className = 'status error';
        status.textContent = 'Remove failed: ' + e.message;
      }
    }

    function staleBadgeIfNeeded(iso) {
      if (!iso) return '<span class="verified never">not yet verified</span>';
      const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
      if (days <= 180) return '';
      return '<span class="verified stale">stale · ' + days + ' days ago</span>';
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
</body>
</html>
